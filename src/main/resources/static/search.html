<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search · KnowledgeForge</title>
  <meta name="description" content="Search documents, spaces and teams in KnowledgeForge.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="main" class="page">

  <header class="page-header">
    <div>
      <h1 class="title-lg">Search</h1>
      <p class="page-header__meta">Everything in the teams you belong to.</p>
    </div>
  </header>

  <form id="search-form" role="search" novalidate>
    <div class="search-field">
      <span id="search-icon"></span>
      <label class="sr-only" for="q">Search</label>
      <input class="input" id="q" type="search" data-search-input autocomplete="off" maxlength="200"
             placeholder="Search titles, text and tags">
      <kbd id="search-kbd">Ctrl K</kbd>
    </div>
  </form>

  <div class="section__header" id="filters" style="margin-top: var(--space-4); flex-wrap: wrap" hidden>
    <div class="chip-row" role="group" aria-label="Show">
      <button type="button" class="chip" data-type="" aria-pressed="true">All <span class="num" data-n=""></span></button>
      <button type="button" class="chip" data-type="document" aria-pressed="false">Documents <span class="num" data-n="document"></span></button>
      <button type="button" class="chip" data-type="space" aria-pressed="false">Spaces <span class="num" data-n="space"></span></button>
      <button type="button" class="chip" data-type="team" aria-pressed="false">Teams <span class="num" data-n="team"></span></button>
      <span id="tag-filter" style="display: contents"></span>
    </div>
    <div class="btn-row">
      <label class="sr-only" for="status">Status</label>
      <select class="select select--sm" id="status" style="width: auto">
        <option value="">Any status</option>
        <option value="DRAFT">Draft documents</option>
        <option value="PUBLISHED">Published documents</option>
      </select>
    </div>
  </div>

  <p class="sr-only" id="announce" role="status" aria-live="polite"></p>
  <div id="results" style="margin-top: var(--space-6)"></div>
</main>

<script src="/app.js"></script>
<script>
  (function () {
    const esc = KF.escapeHtml;
    const $ = function (id) { return document.getElementById(id); };
    const LABELS = { document: "Documents", space: "Spaces", team: "Teams" };
    const GROUP_MAX = 5;   // per group in "All"
    const PAGE = 20;       // per "Load more" in a single type

    $("search-icon").outerHTML = KF.icon("search");

    const params = new URLSearchParams(location.search);
    let q = (params.get("q") || "").trim();
    let tag = (params.get("tag") || "").trim();
    let status = (params.get("status") || "").toUpperCase();
    if (status !== "DRAFT" && status !== "PUBLISHED") status = "";
    let type = (params.get("type") || "").toLowerCase();
    if (!LABELS[type]) type = "";
    let results = [];
    let shown = PAGE;
    let seq = 0; // ignore answers to searches that were replaced by a newer one

    $("q").value = q;
    $("status").value = status;

    function typeOf(r) { return String(r.type || "document").toLowerCase(); }

    function syncUrl() {
      const u = new URL(location.href);
      [["q", q], ["tag", tag], ["status", status.toLowerCase()], ["type", type]].forEach(function (p) {
        if (p[1]) u.searchParams.set(p[0], p[1]); else u.searchParams.delete(p[0]);
      });
      history.replaceState(null, "", u);
    }

    // Escape first, then wrap matches; the query is escaped the same way so it matches the escaped text
    function highlight(text) {
      const safe = esc(text);
      if (!q) return safe;
      const pattern = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return safe.replace(new RegExp("(" + pattern + ")", "gi"), "<mark>$1</mark>");
    }

    // Excerpts are raw markdown; drop the syntax so they read as text
    function plain(md) {
      return String(md).replace(/!?\[([^\]]*)\]\([^)]*\)/g, "$1").replace(/[*`~#>|]+|__/g, "").replace(/\s+/g, " ").trim();
    }

    function hrefFor(r, t) {
      if (t === "team") return "/team.html?id=" + encodeURIComponent(r.teamId);
      if (t === "space") return "/space.html?id=" + encodeURIComponent(r.spaceId);
      return "/document.html?id=" + encodeURIComponent(r.documentId) + "&mode=view";
    }

    function tagHref(name) {
      const u = new URLSearchParams();
      if (q) u.set("q", q);
      u.set("tag", name);
      return "/search.html?" + u;
    }

    function rowHtml(r) {
      const t = typeOf(r);
      const title = r.title || (t === "team" ? "Untitled team" : t === "space" ? "Untitled space" : "Untitled");
      const ico = t === "team" ? KF.teamIcon(title) : t === "space" ? KF.spaceIcon(title) : KF.icon("file-text", "text-steel");
      const where = [];
      if (r.teamName && t !== "team") where.push(esc(r.teamName));
      if (r.spaceName && t === "document") where.push(esc(r.spaceName));
      const meta = [];
      if (where.length) meta.push("<span>" + where.join(" / ") + "</span>");
      if (t === "document" && String(r.status || "").toUpperCase() !== "PUBLISHED") meta.push('<span class="badge badge--draft">Draft</span>');
      if (r.updatedAt) {
        meta.push('<time datetime="' + esc(new Date(r.updatedAt).toISOString()) + '">Updated ' + esc(KF.relativeTime(r.updatedAt)) +
          (r.updatedByName ? " by " + esc(r.updatedByName) : "") + "</time>");
      }
      if (Array.isArray(r.tags) && r.tags.length) {
        meta.push('<span class="tag-list">' + r.tags.map(function (g) { return KF.tag(g, tagHref(g)); }).join("") + "</span>");
      }
      return '<li class="list-row list-row--hover list-row--link">' + ico +
        '<span class="list-row__main">' +
          '<a class="list-row__title" href="' + esc(hrefFor(r, t)) + '">' + highlight(title) + "</a>" +
          (r.excerpt ? '<span class="list-row__excerpt list-row__excerpt--full">' + highlight(plain(r.excerpt)) + "</span>" : "") +
          (meta.length ? '<span class="meta-line">' + meta.join("") + "</span>" : "") +
        "</span></li>";
    }

    function listHtml(items) {
      return '<div class="card card--flush"><ul class="list" role="list">' + items.map(rowHtml).join("") + "</ul></div>";
    }

    function emptyHtml(iconName, title, text, action) {
      return '<div class="empty"><span class="empty__icon">' + KF.icon(iconName) + '</span><h2 class="title-sm">' + title + "</h2>" +
        (text ? '<p class="empty__text">' + text + "</p>" : "") + (action || "") + "</div>";
    }

    function renderFilters() {
      const active = !!(q || tag);
      $("filters").hidden = !active;
      $("search-kbd").hidden = !!$("q").value;
      document.querySelectorAll("[data-type]").forEach(function (c) { c.setAttribute("aria-pressed", String(c.dataset.type === type)); });
      document.querySelectorAll("[data-n]").forEach(function (el) {
        const k = el.dataset.n;
        const n = results.filter(function (r) { return !k || typeOf(r) === k; }).length;
        el.textContent = n;
        el.parentElement.hidden = !!k && !n && type !== k;
      });
      $("tag-filter").innerHTML = tag
        ? '<button type="button" class="chip" aria-pressed="true" data-clear-tag aria-label="Remove tag filter ' + esc(tag) + '">' +
          KF.icon("tag", "icon--sm") + esc(tag) + KF.icon("x", "icon--sm") + "</button>"
        : "";
    }

    function render() {
      renderFilters();
      const box = $("results");
      box.removeAttribute("aria-busy");
      if (!q && !tag) {
        box.innerHTML = emptyHtml("search", "Find anything your teams have written",
          "Search by title, text or tag. Press Ctrl K from any page to jump here.");
        $("announce").textContent = "";
        return;
      }
      const list = results.filter(function (r) { return !type || typeOf(r) === type; });
      $("announce").textContent = list.length + (list.length === 1 ? " result" : " results");
      if (!list.length) {
        const what = q ? "“" + esc(q) + "”" : "the tag “" + esc(tag) + "”";
        const narrowed = tag && q || status || type;
        box.innerHTML = emptyHtml("search", "Nothing matches " + what,
          narrowed ? "Try removing a filter." : "Check the spelling or try a shorter word.",
          narrowed ? '<button type="button" class="btn btn--secondary btn--sm" data-clear-filters>Clear filters</button>' : "");
        return;
      }
      if (type) {
        box.innerHTML = listHtml(list.slice(0, shown)) +
          (list.length > shown ? '<div class="load-more"><button type="button" class="btn btn--secondary" data-more>Show more</button></div>' : "");
        return;
      }
      // "All": one section per type, documents first
      box.innerHTML = ["document", "space", "team"].map(function (t) {
        const items = list.filter(function (r) { return typeOf(r) === t; });
        if (!items.length) return "";
        return '<section class="section" aria-labelledby="h-' + t + '"><div class="section__header">' +
          '<h2 class="title-sm" id="h-' + t + '">' + LABELS[t] + ' <span class="count">' + items.length + "</span></h2>" +
          (items.length > GROUP_MAX ? '<button type="button" class="btn btn--link" data-show-type="' + t + '">Show all ' + items.length + "</button>" : "") +
          "</div>" + listHtml(items.slice(0, GROUP_MAX)) + "</section>";
      }).join("");
    }

    function skeleton() {
      const box = $("results");
      box.setAttribute("aria-busy", "true");
      box.innerHTML = '<div class="card card--flush">' +
        '<div class="skeleton-row"><span class="skeleton skeleton--line"></span></div>'.repeat(4) + "</div>";
    }

    async function run() {
      q = $("q").value.trim();
      status = $("status").value;
      shown = PAGE;
      syncUrl();
      if (!q && !tag) { results = []; render(); return; }
      renderFilters();
      skeleton();
      const mine = ++seq;
      const p = new URLSearchParams();
      if (q) p.set("q", q);
      if (tag) p.set("tag", tag);
      if (status) p.set("status", status);
      try {
        const data = await KF.api("/api/search?" + p);
        if (mine !== seq) return;
        results = Array.isArray(data) ? data : [];
        render();
      } catch (err) {
        if (mine !== seq) return;
        results = [];
        renderFilters();
        $("results").removeAttribute("aria-busy");
        $("results").innerHTML = '<div class="error-state" role="alert">' + KF.icon("alert-circle") +
          '<span class="error-state__msg">Search failed. ' + esc(err.message) + "</span>" +
          '<button type="button" class="btn btn--secondary btn--sm" data-retry>Try again</button></div>';
      }
    }

    /* ---------- Events ---------- */
    $("search-form").addEventListener("submit", function (e) { e.preventDefault(); clearTimeout(typing); run(); });
    // The native clear (x) in a search input fires "search" with an empty value
    $("q").addEventListener("search", function () { if (!$("q").value) run(); });
    let typing;
    $("q").addEventListener("input", function () {
      $("search-kbd").hidden = !!$("q").value;
      clearTimeout(typing);
      typing = setTimeout(run, 300); // results as you type; seq drops stale answers
    });
    $("status").addEventListener("change", run);

    $("filters").addEventListener("click", function (e) {
      if (e.target.closest("[data-clear-tag]")) { tag = ""; run(); $("q").focus(); return; }
      const chip = e.target.closest("[data-type]");
      if (!chip) return;
      type = chip.dataset.type;
      shown = PAGE;
      syncUrl();
      render();
    });

    $("results").addEventListener("click", function (e) {
      if (e.target.closest("[data-retry]")) { run(); return; }
      if (e.target.closest("[data-more]")) { shown += PAGE; render(); return; }
      const showType = e.target.closest("[data-show-type]");
      if (showType) { type = showType.dataset.showType; shown = PAGE; syncUrl(); render(); document.querySelector('[data-type="' + type + '"]').focus(); return; }
      if (e.target.closest("[data-clear-filters]")) {
        type = ""; status = ""; $("status").value = "";
        if (q) tag = ""; // keep the tag when it's the only thing being searched
        run();
      }
    });

    function start() {
      if (q || tag) run(); else render();
      if (!q && !tag) $("q").focus();
    }

    KF.initShell({ active: "search", breadcrumbs: [{ label: "Search" }] }).then(start, function (err) {
      $("results").innerHTML = '<div class="error-state" role="alert">' + KF.icon("alert-circle") +
        '<span class="error-state__msg">Couldn\'t load your account. ' + esc(err.message) + "</span>" +
        '<button type="button" class="btn btn--secondary btn--sm" onclick="location.reload()">Try again</button></div>';
    });
  })();
</script>
</body>
</html>

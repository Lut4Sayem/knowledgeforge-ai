<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team · KnowledgeForge</title>
  <meta name="description" content="A team's spaces, members and join requests on KnowledgeForge.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="main" class="page">

  <header class="page-header" id="header">
    <div style="min-width: 0; flex: 1 1 320px">
      <div class="page-header__title">
        <span id="team-icon"><span class="skeleton" style="display: block; width: 40px; height: 40px"></span></span>
        <h1 class="title-lg" id="team-name"><span class="skeleton skeleton--title" style="display: block; width: 220px; height: 24px"></span></h1>
      </div>
      <p class="page-header__meta" id="team-desc"></p>
      <p class="caption" id="team-meta" aria-live="polite"></p>
    </div>
    <div class="btn-row">
      <button type="button" class="btn btn--secondary" id="invite-btn" hidden>Invite people</button>
      <button type="button" class="btn btn--primary" id="new-space-btn" hidden>New space</button>
    </div>
  </header>

  <!-- Whole-page load error -->
  <div class="error-state" id="load-error" role="alert" hidden>
    <span id="load-error-icon"></span>
    <span class="error-state__msg" id="load-error-msg"></span>
    <button type="button" class="btn btn--secondary btn--sm" id="retry-btn">Try again</button>
    <a class="btn btn--secondary btn--sm" id="back-btn" href="/dashboard.html" hidden>Back to dashboard</a>
  </div>

  <div id="content">
    <div class="tabs" role="tablist" aria-label="Team sections">
      <button type="button" class="tab" role="tab" id="tab-spaces" aria-controls="panel-spaces" aria-selected="true">Spaces <span class="count" id="spaces-count"></span></button>
      <button type="button" class="tab" role="tab" id="tab-members" aria-controls="panel-members">Members <span class="count" id="members-count"></span></button>
      <button type="button" class="tab" role="tab" id="tab-requests" aria-controls="panel-requests" hidden>Requests <span class="count" id="requests-count" hidden></span></button>
    </div>

    <section class="tab-panel" id="panel-spaces" role="tabpanel" aria-labelledby="tab-spaces">
      <div class="grid grid--3" id="spaces" aria-busy="true">
        <span class="skeleton skeleton--card"></span><span class="skeleton skeleton--card"></span><span class="skeleton skeleton--card"></span>
      </div>
    </section>

    <section class="tab-panel" id="panel-members" role="tabpanel" aria-labelledby="tab-members" hidden>
      <div class="table-wrap" id="members"></div>
    </section>

    <section class="tab-panel" id="panel-requests" role="tabpanel" aria-labelledby="tab-requests" hidden>
      <p class="caption" style="margin-bottom: var(--space-3)">People who opened an invite link. Accepted people join as viewers; you can change their role under Members.</p>
      <div class="card card--flush" id="requests"></div>
    </section>
  </div>

  <!-- New space -->
  <dialog class="modal" id="space-modal" aria-labelledby="space-modal-title">
    <form id="space-form" novalidate>
      <div class="modal__header">
        <h2 class="title-md" id="space-modal-title">New space</h2>
        <button type="button" class="btn btn--ghost btn--icon btn--sm" data-close aria-label="Close" id="space-modal-x"></button>
      </div>
      <div class="modal__body">
        <div class="field">
          <label class="label" for="space-name">Space name</label>
          <input class="input" id="space-name" maxlength="80" autocomplete="off" placeholder="e.g. Onboarding" aria-required="true" aria-describedby="space-name-error">
          <p class="field__error" id="space-name-error" hidden></p>
        </div>
        <div class="field">
          <label class="label" for="space-desc">Description <span class="text-steel">(optional)</span></label>
          <textarea class="textarea" id="space-desc" maxlength="500" rows="3" placeholder="What goes in this space?"></textarea>
        </div>
        <div class="error-state" id="space-form-error" role="alert" hidden style="margin-top: var(--space-4)">
          <span id="space-form-error-icon"></span><span class="error-state__msg" id="space-form-error-msg"></span>
        </div>
      </div>
      <div class="modal__footer">
        <button type="button" class="btn btn--secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn--primary" id="space-submit">Create space</button>
      </div>
    </form>
  </dialog>

  <!-- Invite link -->
  <dialog class="modal" id="invite-modal" aria-labelledby="invite-modal-title">
    <div class="modal__header">
      <h2 class="title-md" id="invite-modal-title">Invite people</h2>
      <button type="button" class="btn btn--ghost btn--icon btn--sm" data-close aria-label="Close" id="invite-modal-x"></button>
    </div>
    <div class="modal__body">
      <p style="margin-bottom: var(--space-4)">Anyone with this link can ask to join. You approve each request under Requests. Links don't expire.</p>
      <div class="field">
        <label class="label" for="invite-link">Invite link</label>
        <div class="copy-box">
          <input class="input" id="invite-link" readonly>
          <button type="button" class="btn btn--secondary" id="copy-btn">Copy</button>
        </div>
      </div>
      <div class="error-state" id="invite-error" role="alert" hidden style="margin-top: var(--space-4)">
        <span id="invite-error-icon"></span><span class="error-state__msg" id="invite-error-msg"></span>
        <button type="button" class="btn btn--secondary btn--sm" id="invite-retry">Try again</button>
      </div>
    </div>
    <div class="modal__footer">
      <button type="button" class="btn btn--secondary" data-close>Done</button>
    </div>
  </dialog>
</main>

<script src="/app.js"></script>
<script>
  (function () {
    const esc = KF.escapeHtml;
    const $ = function (id) { return document.getElementById(id); };
    const teamId = new URLSearchParams(location.search).get("id");
    const base = "/api/teams/" + encodeURIComponent(teamId || "");

    ["load-error-icon", "space-form-error-icon", "invite-error-icon"].forEach(function (id) { $(id).outerHTML = KF.icon("alert-circle"); });
    $("space-modal-x").innerHTML = KF.icon("x");
    $("invite-modal-x").innerHTML = KF.icon("x");
    $("new-space-btn").innerHTML = KF.icon("plus") + "New space";
    $("invite-btn").innerHTML = KF.icon("user-plus") + "Invite people";

    let me = null;
    let myRole = null;
    let team = null;
    let members = [];
    let spaceCount = 0;
    let tabs = null;
    let pending = 0;
    let inviteLink = null;

    const ROLES = ["ADMIN", "EDITOR", "VIEWER"];
    function roleLabel(r) { r = String(r || "VIEWER"); return r.charAt(0) + r.slice(1).toLowerCase(); }
    function roleBadge(r) { return '<span class="badge badge--' + esc(String(r || "viewer").toLowerCase()) + '">' + esc(roleLabel(r)) + "</span>"; }
    function aRole(r) { return (r === "VIEWER" ? "a " : "an ") + roleLabel(r).toLowerCase(); }
    function plural(n, word) { return '<span class="num">' + n + "</span> " + word + (n === 1 ? "" : "s"); }
    const isAdmin = function () { return myRole === "ADMIN"; };
    const canEdit = function () { return myRole === "ADMIN" || myRole === "EDITOR"; };

    function renderMeta() {
      $("team-meta").innerHTML = [plural(members.length, "member"), plural(spaceCount, "space"),
        myRole ? "you're " + esc(aRole(myRole)) : "",
        pending ? '<a class="link" href="#panel-requests" data-goto-requests>' + plural(pending, "join request") + "</a>" : ""].filter(Boolean).join(" · ");
      $("members-count").textContent = members.length;
      $("spaces-count").textContent = spaceCount;
    }

    /* ---------- Spaces ---------- */
    function renderSpaces(spaces) {
      const box = $("spaces");
      box.removeAttribute("aria-busy");
      spaceCount = spaces.length;
      renderMeta();
      if (!spaces.length) {
        box.className = "";
        box.innerHTML = '<div class="card"><div class="empty"><span class="empty__icon">' + KF.icon("folder") + "</span>" +
          '<h2 class="title-sm">No spaces yet</h2>' +
          (canEdit()
            ? '<p class="empty__text">Spaces group related documents, like "Onboarding" or "Runbooks". Make the first one.</p>' +
              '<button type="button" class="btn btn--primary" data-new-space>' + KF.icon("plus") + "New space</button>"
            : '<p class="empty__text">An admin or editor of this team can add the first space.</p>') +
          "</div></div>";
        return;
      }
      box.className = "grid grid--3";
      box.innerHTML = spaces.map(function (s) {
        const name = s.name || "Untitled space";
        return '<a class="card card--clickable" href="/space.html?id=' + encodeURIComponent(s.id) + '">' +
          '<div class="card__header">' + KF.teamIcon(name) +
          (s.createdAt ? '<span class="caption">Created ' + esc(KF.formatDate(s.createdAt)) + "</span>" : "") + "</div>" +
          '<h2 class="title-sm">' + esc(name) + "</h2>" +
          (s.description ? '<p class="caption" style="margin-top: var(--space-1)">' + esc(s.description) + "</p>" : "") +
          "</a>";
      }).join("");
    }

    async function loadSpaces() {
      const data = await KF.api(base + "/spaces");
      renderSpaces(Array.isArray(data) ? data : []);
    }

    /* ---------- Members ---------- */
    function renderMembers() {
      const box = $("members");
      const admin = isAdmin();
      box.innerHTML = '<table class="table table--stack"><thead><tr><th scope="col">Member</th><th scope="col">Role</th>' +
        (admin ? '<th scope="col"><span class="sr-only">Actions</span></th>' : "") + "</tr></thead><tbody>" +
        members.map(function (m, i) {
          const self = me && m.email === me.email;
          const name = m.fullName || m.email || "Unknown user";
          const who = '<div style="display: flex; align-items: center; gap: var(--space-3); min-width: 0; text-align: left">' + KF.avatar(m) +
            '<span class="list-row__main"><span class="list-row__title">' + esc(name) + (self ? ' <span class="text-steel">(you)</span>' : "") + "</span>" +
            '<span class="caption truncate">' + esc(m.email || "") + "</span></span></div>";
          // Admins can't change their own role (the API refuses), so they see a badge for themselves
          const role = admin && !self
            ? '<select class="select select--sm" style="width: auto" data-role="' + i + '" aria-label="Role for ' + esc(name) + '">' +
                ROLES.map(function (r) { return '<option value="' + r + '"' + (r === m.role ? " selected" : "") + ">" + roleLabel(r) + "</option>"; }).join("") +
              "</select>"
            : roleBadge(m.role);
          const actions = admin
            ? '<td class="cell-actions" data-label="">' + (self ? "" :
                '<button type="button" class="btn btn--danger btn--sm" data-remove="' + i + '">Remove</button>') + "</td>"
            : "";
          return '<tr><td data-label="">' + who + '</td><td data-label="Role">' + role + "</td>" + actions + "</tr>";
        }).join("") + "</tbody></table>";
    }

    $("members").addEventListener("change", async function (e) {
      const sel = e.target.closest("[data-role]");
      if (!sel) return;
      const m = members[+sel.dataset.role];
      const before = m.role;
      const name = m.fullName || m.email;
      if (sel.value === "ADMIN" || before === "ADMIN") {
        const ok = await KF.confirmDialog(sel.value === "ADMIN"
          ? { title: "Make " + name + " an admin?", message: "Admins can change roles, remove members (including you) and invite people.", confirmLabel: "Make admin", danger: false }
          : { title: "Remove " + name + "'s admin rights?", message: "They become " + aRole(sel.value) + " and can no longer manage members or invites.", confirmLabel: "Change role" });
        if (!ok) { sel.value = before; return; }
      }
      sel.disabled = true;
      try {
        await KF.api(base + "/members/" + encodeURIComponent(m.userId) + "/role", { method: "PUT", json: { role: sel.value } });
        m.role = sel.value;
        KF.toast(name + " is now " + aRole(sel.value) + ".");
      } catch (err) {
        sel.value = before;
        KF.toast("Couldn't change the role. " + err.message, { type: "error" });
      } finally {
        sel.disabled = false;
      }
    });

    $("members").addEventListener("click", async function (e) {
      const btn = e.target.closest("[data-remove]");
      if (!btn) return;
      const m = members[+btn.dataset.remove];
      const name = m.fullName || m.email;
      const ok = await KF.confirmDialog({
        title: "Remove " + name + "?",
        message: "They lose access to this team's spaces and documents. You can invite them again later.",
        confirmLabel: "Remove member"
      });
      if (!ok) return;
      await KF.withLoading(btn, async function () {
        try {
          await KF.api(base + "/members/" + encodeURIComponent(m.userId), { method: "DELETE" });
          KF.toast(name + " was removed from the team.");
          await loadTeam();
        } catch (err) {
          KF.toast("Couldn't remove " + name + ". " + err.message, { type: "error" });
        }
      });
    });

    /* ---------- Join requests (admins) ---------- */
    function renderRequests(list) {
      pending = list.length;
      $("requests-count").textContent = pending || "";
      $("requests-count").hidden = !pending;
      $("requests-count").classList.toggle("count--accent", pending > 0);
      renderMeta();
      const box = $("requests");
      if (!list.length) {
        box.innerHTML = '<div class="empty"><span class="empty__icon">' + KF.icon("inbox") + "</span>" +
          '<p class="body-medium">No pending requests</p>' +
          '<p class="empty__text">When someone opens your invite link, their request waits here for you.</p>' +
          '<button type="button" class="btn btn--secondary" data-invite>' + KF.icon("user-plus") + "Invite people</button></div>";
        return;
      }
      box.innerHTML = '<ul class="list" role="list">' + list.map(function (r) {
        const name = r.fullName || r.email || "Unknown user";
        return '<li class="list-row" style="flex-wrap: wrap">' + KF.avatar(r) +
          '<span class="list-row__main" style="flex-basis: 160px"><span class="list-row__title">' + esc(name) + "</span>" +
          '<span class="caption truncate">' + esc(r.email || "") +
          (r.requestedAt ? " · asked " + esc(KF.relativeTime(r.requestedAt)) : "") + "</span></span>" +
          '<span class="btn-row" style="margin-left: auto">' +
            '<button type="button" class="btn btn--ghost btn--sm" data-reject="' + esc(r.id) + '" data-name="' + esc(name) + '">Decline</button>' +
            '<button type="button" class="btn btn--secondary btn--sm" data-accept="' + esc(r.id) + '" data-name="' + esc(name) + '">Accept</button>' +
          "</span></li>";
      }).join("") + "</ul>";
    }

    async function loadRequests() {
      if (!isAdmin()) return;
      try {
        const list = await KF.api(base + "/join-requests");
        renderRequests(Array.isArray(list) ? list : []);
      } catch (err) {
        $("requests").innerHTML = '<div class="error-state" role="alert" style="margin: var(--space-3)">' + KF.icon("alert-circle") +
          '<span class="error-state__msg">Couldn\'t load join requests. ' + esc(err.message) + "</span>" +
          '<button type="button" class="btn btn--secondary btn--sm" data-reload-requests>Try again</button></div>';
      }
    }

    $("requests").addEventListener("click", async function (e) {
      if (e.target.closest("[data-reload-requests]")) { loadRequests(); return; }
      if (e.target.closest("[data-invite]")) { openInvite(); return; }
      const btn = e.target.closest("[data-accept], [data-reject]");
      if (!btn) return;
      const accept = btn.hasAttribute("data-accept");
      const id = btn.dataset.accept || btn.dataset.reject;
      const name = btn.dataset.name;
      await KF.withLoading(btn, async function () {
        try {
          await KF.api(base + "/join-requests/" + encodeURIComponent(id) + (accept ? "/accept" : "/reject"), { method: "POST" });
          KF.toast(accept ? name + " joined the team as a viewer." : "Declined " + name + "'s request.");
          await Promise.all([loadRequests(), accept ? loadTeam() : null]);
        } catch (err) {
          KF.toast("Couldn't " + (accept ? "accept" : "decline") + " the request. " + err.message, { type: "error" });
        }
      });
    });

    /* ---------- Team ---------- */
    async function loadTeam() {
      const d = (await KF.api(base)) || {};
      team = d.team || {};
      members = Array.isArray(d.teamMembers) ? d.teamMembers : [];
      const mine = members.find(function (m) { return me && m.email === me.email; });
      myRole = (mine && mine.role) || KF.roleIn(teamId);

      const name = team.name || "Untitled team";
      document.title = name + " · KnowledgeForge";
      $("team-icon").innerHTML = KF.teamIcon(name, "lg");
      $("team-name").textContent = name;
      $("team-desc").textContent = team.description || "";
      $("team-desc").hidden = !team.description;
      KF.setBreadcrumbs([{ label: "Dashboard", href: "/dashboard.html" }, { label: name }]);
      $("new-space-btn").hidden = !canEdit();
      $("invite-btn").hidden = !isAdmin();
      $("tab-requests").hidden = !isAdmin();
      renderMeta();
      renderMembers();
    }

    function showLoadError(err) {
      $("header").hidden = true;
      $("content").hidden = true;
      const known = err.status === 403 || err.status === 404 || !teamId;
      $("load-error-msg").textContent = !teamId ? "No team was picked. Open a team from the sidebar or the dashboard."
        : err.status === 403 ? "You're not a member of this team. Ask an admin for an invite link."
        : err.status === 404 ? "This team doesn't exist. It may have been deleted."
        : "Couldn't load this team. " + err.message;
      $("retry-btn").hidden = known;
      $("back-btn").hidden = !known;
      $("load-error").hidden = false;
    }

    async function load() {
      $("load-error").hidden = true;
      try {
        await loadTeam();
        await Promise.all([loadSpaces(), loadRequests()]);
        $("header").hidden = false;
        $("content").hidden = false;
        if (!tabs) {
          // Drop the Requests tab for non-admins so arrow keys can't land on it
          if (!isAdmin()) { $("tab-requests").remove(); $("panel-requests").remove(); }
          tabs = KF.initTabs(document.querySelector('[role="tablist"]'));
        }
      } catch (err) {
        showLoadError(err);
      }
    }

    $("team-meta").addEventListener("click", function (e) {
      if (!e.target.closest("[data-goto-requests]")) return;
      e.preventDefault();
      tabs.select($("tab-requests"), true);
    });

    let shellReady = false;
    $("retry-btn").addEventListener("click", function () {
      if (!shellReady) { location.reload(); return; }
      KF.withLoading($("retry-btn"), load);
    });

    /* ---------- New space ---------- */
    const spaceModal = $("space-modal");
    const spaceName = $("space-name");

    function fieldError(input, errEl, msg) {
      input.setAttribute("aria-invalid", msg ? "true" : "false");
      errEl.hidden = !msg;
      errEl.innerHTML = msg ? KF.icon("alert-circle", "icon--sm") + esc(msg) : "";
    }

    function openSpaceModal() {
      $("space-form").reset();
      fieldError(spaceName, $("space-name-error"), "");
      $("space-form-error").hidden = true;
      KF.openModal(spaceModal);
      spaceName.focus();
    }
    $("new-space-btn").addEventListener("click", openSpaceModal);
    $("spaces").addEventListener("click", function (e) { if (e.target.closest("[data-new-space]")) openSpaceModal(); });
    spaceName.addEventListener("input", function () { if (spaceName.value.trim()) fieldError(spaceName, $("space-name-error"), ""); });

    $("space-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const name = spaceName.value.trim();
      const description = $("space-desc").value.trim();
      fieldError(spaceName, $("space-name-error"), name ? "" : "Give the space a name.");
      if (!name) { spaceName.focus(); return; }
      $("space-form-error").hidden = true;
      KF.withLoading($("space-submit"), async function () {
        try {
          await KF.api(base + "/spaces", { json: { name: name, description: description } });
          spaceModal.close();
          KF.toast("Created " + name + ".");
          tabs.select($("tab-spaces"));
          await loadSpaces();
        } catch (err) {
          $("space-form-error-msg").textContent = "Couldn't create the space. " + err.message;
          $("space-form-error").hidden = false;
        }
      });
    });

    /* ---------- Invite link ---------- */
    const inviteModal = $("invite-modal");
    const inviteInput = $("invite-link");

    async function createInvite() {
      $("invite-error").hidden = true;
      if (inviteLink) { inviteInput.value = inviteLink; $("copy-btn").disabled = false; return; }
      inviteInput.value = "Creating link…";
      $("copy-btn").disabled = true;
      try {
        const inv = await KF.api(base + "/invite", { method: "POST" });
        inviteLink = location.origin + "/join.html?code=" + encodeURIComponent(inv.inviteCode);
        inviteInput.value = inviteLink;
        $("copy-btn").disabled = false;
        inviteInput.select();
      } catch (err) {
        inviteInput.value = "";
        $("invite-error-msg").textContent = "Couldn't create an invite link. " + err.message;
        $("invite-error").hidden = false;
      }
    }

    function openInvite() {
      $("copy-btn").textContent = "Copy";
      KF.openModal(inviteModal);
      createInvite();
    }
    $("invite-btn").addEventListener("click", openInvite);
    $("invite-retry").addEventListener("click", function () { KF.withLoading($("invite-retry"), createInvite); });

    $("copy-btn").addEventListener("click", async function () {
      let ok = true;
      try {
        await navigator.clipboard.writeText(inviteInput.value);
      } catch (e) {
        inviteInput.select();
        ok = document.execCommand("copy"); // fallback for http:// or blocked clipboard
      }
      if (!ok) { inviteInput.select(); KF.toast("Couldn't copy. The link is selected: press Ctrl+C.", { type: "error" }); return; }
      $("copy-btn").innerHTML = KF.icon("check") + "Copied";
      setTimeout(function () { $("copy-btn").textContent = "Copy"; }, 2000);
    });

    KF.initShell({ active: teamId, breadcrumbs: [{ label: "Dashboard", href: "/dashboard.html" }, { label: "Team" }] }).then(function (s) {
      shellReady = true;
      me = s.me;
      if (!teamId) { showLoadError({}); return; }
      return load();
    }, showLoadError);
  })();
</script>
</body>
</html>

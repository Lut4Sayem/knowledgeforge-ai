<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Space · KnowledgeForge</title>
  <meta name="description" content="The documents in a KnowledgeForge space.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="main" class="page">

  <header class="page-header" id="header">
    <div style="min-width: 0; flex: 1 1 320px">
      <div class="page-header__title">
        <span id="space-icon"><span class="skeleton" style="display: block; width: 40px; height: 40px"></span></span>
        <h1 class="title-lg" id="space-name"><span class="skeleton skeleton--title" style="display: block; width: 220px; height: 24px"></span></h1>
      </div>
      <p class="page-header__meta" id="space-desc" hidden></p>
      <p class="caption" id="space-meta"></p>
    </div>
    <button type="button" class="btn btn--primary" id="new-doc-btn" hidden>New document</button>
  </header>

  <!-- Whole-page load error -->
  <div class="error-state" id="load-error" role="alert" hidden>
    <span id="load-error-icon"></span>
    <span class="error-state__msg" id="load-error-msg"></span>
    <button type="button" class="btn btn--secondary btn--sm" id="retry-btn">Try again</button>
    <a class="btn btn--secondary btn--sm" id="back-btn" href="/dashboard.html" hidden>Back to dashboard</a>
  </div>

  <section id="content" aria-labelledby="docs-title">
    <div class="section__header">
      <h2 class="sr-only" id="docs-title">Documents</h2>
      <div class="chip-row" id="filters" role="group" aria-label="Filter by status" hidden>
        <button type="button" class="chip" data-filter="" aria-pressed="true">All <span class="num" data-n=""></span></button>
        <button type="button" class="chip" data-filter="DRAFT" aria-pressed="false">Drafts <span class="num" data-n="DRAFT"></span></button>
        <button type="button" class="chip" data-filter="PUBLISHED" aria-pressed="false">Published <span class="num" data-n="PUBLISHED"></span></button>
      </div>
    </div>
    <div class="card card--flush" id="docs" aria-busy="true">
      <div class="skeleton-row"><span class="skeleton skeleton--line"></span></div>
      <div class="skeleton-row"><span class="skeleton skeleton--line"></span></div>
      <div class="skeleton-row"><span class="skeleton skeleton--line"></span></div>
    </div>
  </section>

  <!-- New document -->
  <dialog class="modal" id="doc-modal" aria-labelledby="doc-modal-title">
    <form id="doc-form" novalidate>
      <div class="modal__header">
        <h2 class="title-md" id="doc-modal-title">New document</h2>
        <button type="button" class="btn btn--ghost btn--icon btn--sm" data-close aria-label="Close" id="doc-modal-x"></button>
      </div>
      <div class="modal__body">
        <p style="margin-bottom: var(--space-4)">It starts as a draft. You'll go straight to the editor.</p>
        <div class="field">
          <label class="label" for="doc-title">Title</label>
          <input class="input" id="doc-title" maxlength="200" autocomplete="off" placeholder="e.g. How we deploy" aria-required="true" aria-describedby="doc-title-error">
          <p class="field__error" id="doc-title-error" hidden></p>
        </div>
        <div class="error-state" id="doc-form-error" role="alert" hidden style="margin-top: var(--space-4)">
          <span id="doc-form-error-icon"></span><span class="error-state__msg" id="doc-form-error-msg"></span>
        </div>
      </div>
      <div class="modal__footer">
        <button type="button" class="btn btn--secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn--primary" id="doc-submit">Create and edit</button>
      </div>
    </form>
  </dialog>
</main>

<script src="/app.js"></script>
<script>
  (function () {
    const esc = KF.escapeHtml;
    const $ = function (id) { return document.getElementById(id); };
    const spaceId = new URLSearchParams(location.search).get("id");
    const base = "/api/spaces/" + encodeURIComponent(spaceId || "");

    ["load-error-icon", "doc-form-error-icon"].forEach(function (id) { $(id).outerHTML = KF.icon("alert-circle"); });
    $("doc-modal-x").innerHTML = KF.icon("x");
    $("new-doc-btn").innerHTML = KF.icon("plus") + "New document";

    let space = null;
    let docs = [];
    let filter = (new URLSearchParams(location.search).get("status") || "").toUpperCase();
    if (filter !== "DRAFT" && filter !== "PUBLISHED") filter = "";
    let editable = false;

    function docHref(id, mode) { return "/document.html?id=" + encodeURIComponent(id) + "&mode=" + mode; }

    const isPublished = function (d) { return String(d.status || "").toUpperCase() === "PUBLISHED"; };

    // First words of the document as plain text, so a row says what's inside
    function excerpt(md) {
      return String(md || "").replace(/```[\s\S]*?```/g, " ").replace(/!\[[^\]]*\]\([^)]*\)/g, " ")
        .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1").replace(/[#>*_`~|-]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 160);
    }

    function renderMeta() {
      // Counts live on the filter chips; the meta line only says what you can't do
      $("space-meta").textContent = editable ? "" : "You're a viewer in this team, so you can read and comment but not edit.";
      $("space-meta").hidden = editable;
      document.querySelectorAll("[data-n]").forEach(function (el) {
        const k = el.dataset.n;
        el.textContent = !k ? docs.length : docs.filter(function (d) { return (isPublished(d) ? "PUBLISHED" : "DRAFT") === k; }).length;
      });
    }

    function emptyHtml() {
      return '<div class="empty"><span class="empty__icon">' + KF.icon("file-text") + "</span>" +
        '<h3 class="title-sm">No documents yet</h3>' +
        (editable
          ? '<p class="empty__text">Write the first page: a how-to, a decision, a runbook. It starts as a draft.</p>' +
            '<button type="button" class="btn btn--primary" data-new-doc>' + KF.icon("plus") + "New document</button>"
          : '<p class="empty__text">Nothing here yet. An admin or editor of this team can add the first document.</p>') +
        "</div>";
    }

    function renderDocs() {
      const box = $("docs");
      box.removeAttribute("aria-busy");
      renderMeta();
      $("filters").hidden = docs.length === 0;
      document.querySelectorAll("[data-filter]").forEach(function (c) { c.setAttribute("aria-pressed", String(c.dataset.filter === filter)); });
      $("new-doc-btn").hidden = !editable || docs.length === 0; // the empty state has its own button
      if (!docs.length) { box.innerHTML = emptyHtml(); return; }

      const shown = docs.filter(function (d) { return !filter || (isPublished(d) ? "PUBLISHED" : "DRAFT") === filter; });
      if (!shown.length) {
        box.innerHTML = '<div class="empty"><p class="body-medium">No ' + (filter === "DRAFT" ? "drafts" : "published documents") + '</p>' +
          '<button type="button" class="btn btn--secondary btn--sm" data-clear-filter>Show all documents</button></div>';
        return;
      }
      box.innerHTML = '<ul class="list" role="list">' + shown.map(function (d) {
        const title = d.title || "Untitled";
        const tags = Array.isArray(d.tags) && d.tags.length
          ? '<span class="tag-list">' + d.tags.slice(0, 3).map(function (t) { return KF.tag(t); }).join("") + "</span>" : "";
        const when = d.updatedAt
          ? '<time class="caption" datetime="' + esc(new Date(d.updatedAt).toISOString()) + '">Updated ' + esc(KF.relativeTime(d.updatedAt)) + "</time>" : "";
        const actions = editable
          ? '<a class="btn btn--ghost btn--icon btn--sm" href="' + esc(docHref(d.id, "edit")) + '" aria-label="Edit ' + esc(title) + '" title="Edit">' + KF.icon("pencil") + "</a>" +
            '<button type="button" class="btn btn--ghost btn--icon btn--sm" data-delete="' + esc(d.id) + '" aria-label="Delete ' + esc(title) + '" title="Delete">' + KF.icon("trash") + "</button>"
          : "";
        const text = excerpt(d.content);
        // Published is the normal state; only drafts get a badge
        const draft = isPublished(d) ? "" : '<span class="badge badge--draft">Draft</span>';
        return '<li class="list-row list-row--hover list-row--link">' + KF.icon("file-text", "text-steel") +
          '<span class="list-row__main">' +
            '<a class="list-row__title" href="' + esc(docHref(d.id, "view")) + '">' + esc(title) + "</a>" +
            (text ? '<span class="list-row__excerpt">' + esc(text) + "</span>" : "") +
            '<span class="meta-line">' + draft + when + tags + "</span>" +
          "</span>" + (actions ? '<span class="btn-row" style="flex: none">' + actions + "</span>" : "") + "</li>";
      }).join("") + "</ul>";
    }

    async function loadDocs() {
      const data = await KF.api(base + "/documents");
      // Newest edits first
      docs = (Array.isArray(data) ? data : []).sort(function (a, b) { return new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0); });
      renderDocs();
    }

    /* ---------- Filters ---------- */
    $("filters").addEventListener("click", function (e) {
      const chip = e.target.closest("[data-filter]");
      if (!chip) return;
      filter = chip.dataset.filter;
      const u = new URL(location.href);
      if (filter) u.searchParams.set("status", filter.toLowerCase()); else u.searchParams.delete("status");
      history.replaceState(null, "", u);
      renderDocs();
    });

    /* ---------- Delete ---------- */
    $("docs").addEventListener("click", async function (e) {
      if (e.target.closest("[data-new-doc]")) { openDocModal(); return; }
      if (e.target.closest("[data-clear-filter]")) { document.querySelector('[data-filter=""]').click(); return; }
      const btn = e.target.closest("[data-delete]");
      if (!btn) return;
      const d = docs.find(function (x) { return x.id === btn.dataset.delete; });
      const title = (d && d.title) || "Untitled";
      const ok = await KF.confirmDialog({
        title: "Delete “" + title + "”?",
        message: "Its versions, comments and files are deleted too. This can't be undone.",
        confirmLabel: "Delete document"
      });
      if (!ok) return;
      await KF.withLoading(btn, async function () {
        try {
          await KF.api("/api/documents/" + encodeURIComponent(btn.dataset.delete), { method: "DELETE" });
          KF.toast("Deleted “" + title + "”.");
          await loadDocs();
        } catch (err) {
          KF.toast("Couldn't delete the document. " + err.message, { type: "error" });
        }
      });
    });

    /* ---------- Space ---------- */
    function showLoadError(err) {
      $("header").hidden = true;
      $("content").hidden = true;
      const known = err.status === 403 || err.status === 404 || !spaceId;
      $("load-error-msg").textContent = !spaceId ? "No space was picked. Open one from its team page."
        : err.status === 403 ? "You're not a member of this space's team. Ask a team admin for an invite link."
        : err.status === 404 ? "This space doesn't exist. It may have been deleted."
        : "Couldn't load this space. " + err.message;
      $("retry-btn").hidden = known;
      $("back-btn").hidden = !known;
      $("load-error").hidden = false;
    }

    async function load() {
      $("load-error").hidden = true;
      try {
        space = (await KF.api(base)) || {};
        editable = KF.canEdit(space.teamId);
        const name = space.name || "Untitled space";
        const team = (KF.teams().find(function (t) { return t.teamId === space.teamId; }) || {}).teamName || "Team";
        document.title = name + " · KnowledgeForge";
        $("space-icon").innerHTML = KF.spaceIcon(name, "lg");
        $("space-name").textContent = name;
        $("space-desc").textContent = space.description || "";
        $("space-desc").hidden = !space.description;
        // The space belongs to a team: mark that team as where you are in the sidebar
        const link = document.querySelector('#kf-sidebar a[href="/team.html?id=' + encodeURIComponent(space.teamId) + '"]');
        if (link) { link.classList.add("is-active"); link.setAttribute("aria-current", "page"); }
        KF.setBreadcrumbs([{ label: team, href: "/team.html?id=" + encodeURIComponent(space.teamId) }, { label: name }]);
        await loadDocs();
        $("header").hidden = false;
        $("content").hidden = false;
      } catch (err) {
        showLoadError(err);
      }
    }

    let shellReady = false;
    $("retry-btn").addEventListener("click", function () {
      if (!shellReady) { location.reload(); return; }
      KF.withLoading($("retry-btn"), load);
    });

    /* ---------- New document ---------- */
    const modal = $("doc-modal");
    const titleIn = $("doc-title");

    function fieldError(msg) {
      titleIn.setAttribute("aria-invalid", msg ? "true" : "false");
      $("doc-title-error").hidden = !msg;
      $("doc-title-error").innerHTML = msg ? KF.icon("alert-circle", "icon--sm") + esc(msg) : "";
    }

    function openDocModal() {
      $("doc-form").reset();
      fieldError("");
      $("doc-form-error").hidden = true;
      KF.openModal(modal);
      titleIn.focus();
    }
    $("new-doc-btn").addEventListener("click", openDocModal);
    titleIn.addEventListener("input", function () { if (titleIn.value.trim()) fieldError(""); });

    $("doc-form").addEventListener("submit", function (e) {
      e.preventDefault();
      const title = titleIn.value.trim();
      fieldError(title ? "" : "Give the document a title.");
      if (!title) { titleIn.focus(); return; }
      $("doc-form-error").hidden = true;
      KF.withLoading($("doc-submit"), async function () {
        try {
          const doc = await KF.api(base + "/documents", { json: { title: title, content: "", tags: [], status: "DRAFT" } });
          if (doc && doc.id) { location.href = docHref(doc.id, "edit"); return; }
          modal.close();
          await loadDocs();
        } catch (err) {
          $("doc-form-error-msg").textContent = "Couldn't create the document. " + err.message;
          $("doc-form-error").hidden = false;
        }
      });
    });

    KF.initShell({ active: null, breadcrumbs: [{ label: "Team" }, { label: "Space" }] }).then(function () {
      shellReady = true;
      if (!spaceId) { showLoadError({}); return; }
      return load();
    }, showLoadError);
  })();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · KnowledgeForge</title>
  <meta name="description" content="Your teams, recently updated documents and team activity on KnowledgeForge.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="main" class="page">

  <header class="page-header">
    <div style="min-width: 0; flex: 1 1 320px">
      <h1 class="title-lg" id="greeting">Dashboard</h1>
      <p class="page-header__meta body-lg" id="summary" aria-live="polite">
        <span class="skeleton skeleton--line" style="display: block; width: min(420px, 100%); margin-top: var(--space-2)"></span>
      </p>
    </div>
    <button type="button" class="btn btn--primary" id="new-team-btn" hidden>New team</button>
  </header>

  <!-- Whole-page load error -->
  <div class="error-state" id="load-error" role="alert" hidden>
    <span id="load-error-icon"></span>
    <span class="error-state__msg" id="load-error-msg"></span>
    <button type="button" class="btn btn--secondary btn--sm" id="retry-btn">Try again</button>
  </div>

  <!-- No teams at all -->
  <div class="card" id="no-teams" hidden>
    <div class="empty">
      <span class="empty__icon" id="no-teams-icon"></span>
      <h2 class="title-sm">Start with a team</h2>
      <p class="empty__text">Teams hold spaces, and spaces hold your documents. Create one, or open an invite link a teammate sent you.</p>
      <button type="button" class="btn btn--primary" id="first-team-btn">Create a team</button>
    </div>
  </div>

  <div class="layout-aside" id="content">
      <section aria-labelledby="recent-title">
        <div class="section__header">
          <h2 class="title-sm" id="recent-title">Recently updated</h2>
          <a class="link caption" href="/search.html">Search all documents</a>
        </div>
        <div class="card card--flush" id="recent" aria-busy="true">
          <div class="skeleton-row"><span class="skeleton skeleton--line"></span></div>
          <div class="skeleton-row"><span class="skeleton skeleton--line"></span></div>
          <div class="skeleton-row"><span class="skeleton skeleton--line"></span></div>
        </div>
      </section>

    <aside class="layout-aside__side" aria-labelledby="activity-title">
      <div class="section__header">
        <h2 class="title-sm" id="activity-title">Activity</h2>
      </div>
      <div id="activity" aria-busy="true">
        <div class="skeleton-row" style="padding-inline: 0"><span class="skeleton skeleton--avatar"></span><span class="skeleton skeleton--line"></span></div>
        <div class="skeleton-row" style="padding-inline: 0"><span class="skeleton skeleton--avatar"></span><span class="skeleton skeleton--line"></span></div>
        <div class="skeleton-row" style="padding-inline: 0"><span class="skeleton skeleton--avatar"></span><span class="skeleton skeleton--line"></span></div>
      </div>
    </aside>

    <section aria-labelledby="teams-title">
      <div class="section__header">
        <h2 class="title-sm" id="teams-title">Your teams</h2>
      </div>
      <div class="card card--flush" id="teams" aria-busy="true">
        <div class="skeleton-row"><span class="skeleton skeleton--line"></span></div>
        <div class="skeleton-row"><span class="skeleton skeleton--line"></span></div>
      </div>
    </section>
  </div>

  <dialog class="modal" id="team-modal" aria-labelledby="team-modal-title">
    <form id="team-form" novalidate>
      <div class="modal__header">
        <h2 class="title-md" id="team-modal-title">New team</h2>
        <button type="button" class="btn btn--ghost btn--icon btn--sm" data-close aria-label="Close" id="team-modal-x"></button>
      </div>
      <div class="modal__body">
        <p style="margin-bottom: var(--space-4)">You'll be the team's admin. You can invite people from the team page.</p>
        <div class="field">
          <label class="label" for="team-name">Team name</label>
          <input class="input" id="team-name" name="teamName" maxlength="80" autocomplete="off" placeholder="e.g. Platform" aria-required="true" aria-describedby="team-name-error">
          <p class="field__error" id="team-name-error" hidden></p>
        </div>
        <div class="field">
          <label class="label" for="team-desc">Description <span class="text-steel">(optional)</span></label>
          <textarea class="textarea" id="team-desc" name="teamDescription" maxlength="500" rows="3" placeholder="What does this team write down?"></textarea>
        </div>
        <div class="error-state" id="team-form-error" role="alert" hidden style="margin-top: var(--space-4)">
          <span id="team-form-error-icon"></span><span class="error-state__msg" id="team-form-error-msg"></span>
        </div>
      </div>
      <div class="modal__footer">
        <button type="button" class="btn btn--secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn--primary" id="team-submit">Create team</button>
      </div>
    </form>
  </dialog>
</main>

<script src="/app.js"></script>
<script>
  (function () {
    const esc = KF.escapeHtml;
    const $ = function (id) { return document.getElementById(id); };

    $("load-error-icon").outerHTML = KF.icon("alert-circle");
    $("team-form-error-icon").outerHTML = KF.icon("alert-circle");
    $("no-teams-icon").innerHTML = KF.icon("users");
    $("team-modal-x").innerHTML = KF.icon("x");
    $("new-team-btn").innerHTML = KF.icon("plus") + "New team";

    const ACTIONS = {
      CREATE_DOCUMENT: "created",
      UPDATE_DOCUMENT: "updated",
      DELETE_DOCUMENT: "deleted",
      RESTORE_DOCUMENT: "restored an older version of"
    };

    function docHref(id) { return "/document.html?id=" + encodeURIComponent(id) + "&mode=view"; }

    function greeting(me) {
      const h = new Date().getHours();
      const part = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
      const first = String((me && (me.fullName || me.email)) || "").split(/[\s@]/)[0];
      return first ? part + ", " + first : part;
    }

    function summaryHtml(d, recent) {
      if (!d.teamCount) return "You're not in a team yet.";
      let s = (d.teamCount === 1 ? "Your team holds " : "Your <span class=\"num\">" + d.teamCount + "</span> teams hold ") +
        "<span class=\"num\">" + d.spaceCount + "</span> " + (d.spaceCount === 1 ? "space" : "spaces") + " and " +
        "<span class=\"num\">" + d.documentCount + "</span> " + (d.documentCount === 1 ? "document" : "documents") + ".";
      const last = recent[0];
      if (last && last.updatedAt) {
        s += " The last edit was <a class=\"link\" href=\"" + esc(docHref(last.documentId)) + "\">" + esc(last.title || "Untitled") + "</a>, " +
          esc(KF.relativeTime(last.updatedAt)) + ".";
      }
      return s;
    }

    function statusBadge(status) {
      const s = String(status || "").toUpperCase();
      if (s === "PUBLISHED") return '<span class="badge badge--published">Published</span>';
      if (s === "DRAFT") return '<span class="badge badge--draft">Draft</span>';
      return s ? '<span class="badge">' + esc(s.charAt(0) + s.slice(1).toLowerCase()) + "</span>" : "";
    }

    function renderRecent(recent) {
      const box = $("recent");
      box.removeAttribute("aria-busy");
      if (!recent.length) {
        box.innerHTML = '<div class="empty"><span class="empty__icon">' + KF.icon("file-text") + "</span>" +
          '<p class="body-medium">No documents yet</p>' +
          '<p class="empty__text">Open a team, pick a space and write the first page. It shows up here.</p></div>';
        return;
      }
      box.innerHTML = '<ul class="list" role="list">' + recent.map(function (r) {
        const where = esc([r.teamName, r.spaceName].filter(Boolean).join(" / "));
        const when = r.updatedAt ? '<time datetime="' + esc(new Date(r.updatedAt).toISOString()) + '">' + esc(KF.relativeTime(r.updatedAt)) + "</time>" : "";
        const caption = [where, when].filter(Boolean).join(" · ");
        return '<li><a class="list-row" href="' + esc(docHref(r.documentId)) + '">' +
          KF.icon("file-text", "text-steel") +
          '<span class="list-row__main"><span class="list-row__title">' + esc(r.title || "Untitled") + "</span>" +
          (caption ? '<span class="caption truncate">' + caption + "</span>" : "") + "</span>" +
          statusBadge(r.status) +
          "</a></li>";
      }).join("") + "</ul>";
    }

    function dayLabel(value) {
      const d = new Date(value);
      if (isNaN(d)) return "Earlier";
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const diff = Math.round((today - new Date(d).setHours(0, 0, 0, 0)) / 86400000);
      return diff === 0 ? "Today" : diff === 1 ? "Yesterday" : KF.formatDate(d);
    }

    function renderActivity(items) {
      const box = $("activity");
      box.removeAttribute("aria-busy");
      if (!items.length) {
        box.innerHTML = '<p class="caption">Nothing yet. Creating, editing and restoring documents shows up here.</p>';
        return;
      }
      // Merge back-to-back repeats (same person, action and document on the same day) into one row with a count
      const merged = [];
      items.forEach(function (a) {
        const prev = merged[merged.length - 1];
        if (prev && prev.actorUserId === a.actorUserId && prev.action === a.action && prev.targetId === a.targetId &&
            dayLabel(prev.createdAt) === dayLabel(a.createdAt)) prev.times++;
        else merged.push(Object.assign({ times: 1 }, a));
      });
      let lastDay = null;
      box.innerHTML = merged.slice(0, 10).map(function (a) {
        const day = dayLabel(a.createdAt);
        const head = day !== lastDay ? '<p class="overline activity__day">' + esc(day) + "</p>" : "";
        lastDay = day;
        const actor = a.actorFullName || a.actorEmail || "Someone";
        const verb = ACTIONS[a.action] || String(a.action || "changed").toLowerCase().replace(/_/g, " ");
        const title = esc(a.targetTitle || "Untitled");
        // Deleted documents have no page to open
        const target = a.targetId && a.action !== "DELETE_DOCUMENT"
          ? '<a class="link" href="' + esc(docHref(a.targetId)) + '">' + title + "</a>"
          : "<strong>" + title + "</strong>";
        // Older days already have a date heading; only today's rows need a time
        const time = day === "Today" ? KF.relativeTime(a.createdAt) : "";
        return head + '<div class="activity-item">' + KF.avatar({ fullName: actor }, "sm") +
          '<span class="activity-item__text"><strong>' + esc(actor) + "</strong> " + esc(verb) + " " + target +
          (a.times > 1 ? ' <span class="text-steel num">(' + a.times + " times)</span>" : "") +
          (a.teamName ? ' <span class="text-steel">in ' + esc(a.teamName) + "</span>" : "") + "</span>" +
          (time ? '<span class="activity-item__time">' + esc(time) + "</span>" : "") + "</div>";
      }).join("");
    }

    function count(n, word) { return '<span class="num">' + n + "</span> " + word + (n === 1 ? "" : "s"); }

    function renderTeams(teams) {
      const box = $("teams");
      box.removeAttribute("aria-busy");
      box.innerHTML = '<ul class="list" role="list">' + teams.map(function (t) {
        const name = t.name || "Untitled team";
        const desc = t.description && t.description.trim() !== name.trim() ? esc(t.description) : "";
        const caption = [count(t.spaceCount || 0, "space") + " · " + count(t.documentCount || 0, "doc"), desc].filter(Boolean).join(" · ");
        // Role only matters when it limits you; most people admin their own teams
        const role = t.role && t.role !== "ADMIN"
          ? '<span class="badge badge--' + esc(t.role.toLowerCase()) + '">' + esc(t.role.charAt(0) + t.role.slice(1).toLowerCase()) + "</span>" : "";
        return '<li><a class="list-row" href="/team.html?id=' + encodeURIComponent(t.teamId) + '">' + KF.teamIcon(t.name) +
          '<span class="list-row__main"><span class="list-row__title">' + esc(name) + "</span>" +
          '<span class="caption truncate">' + caption + "</span></span>" + role + "</a></li>";
      }).join("") + "</ul>";
    }

    function showLoadError(err) {
      $("summary").textContent = "";
      $("content").hidden = true;
      $("no-teams").hidden = true;
      $("load-error-msg").textContent = "Couldn't load your dashboard. " + err.message;
      $("load-error").hidden = false;
    }

    async function load() {
      $("load-error").hidden = true;
      try {
        const d = (await KF.api("/api/dashboard")) || {};
        const teams = Array.isArray(d.teams) ? d.teams : [];
        const recent = Array.isArray(d.recentDocuments) ? d.recentDocuments : [];
        const activity = Array.isArray(d.recentActivity) ? d.recentActivity : [];
        d.teamCount = d.teamCount || 0; d.spaceCount = d.spaceCount || 0; d.documentCount = d.documentCount || 0;

        $("summary").innerHTML = summaryHtml(d, recent);
        const none = teams.length === 0;
        $("no-teams").hidden = !none;
        $("content").hidden = none;
        $("new-team-btn").hidden = none;
        if (none) return;
        renderRecent(recent);
        renderActivity(activity);
        renderTeams(teams);
      } catch (err) {
        showLoadError(err);
      }
    }

    let shellReady = false;
    $("retry-btn").addEventListener("click", function () {
      if (!shellReady) { location.reload(); return; } // the sidebar never loaded: start over
      KF.withLoading($("retry-btn"), load);
    });

    /* ---------- New team ---------- */
    const modal = $("team-modal");
    const form = $("team-form");
    const nameIn = $("team-name");
    const descIn = $("team-desc");

    function fieldError(input, errEl, msg) {
      input.setAttribute("aria-invalid", msg ? "true" : "false");
      errEl.hidden = !msg;
      errEl.innerHTML = msg ? KF.icon("alert-circle", "icon--sm") + esc(msg) : "";
    }

    function openTeamModal() {
      form.reset();
      fieldError(nameIn, $("team-name-error"), "");
      $("team-form-error").hidden = true;
      KF.openModal(modal);
      nameIn.focus();
    }
    $("new-team-btn").addEventListener("click", openTeamModal);
    $("first-team-btn").addEventListener("click", openTeamModal);

    nameIn.addEventListener("input", function () { if (nameIn.value.trim()) fieldError(nameIn, $("team-name-error"), ""); });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const name = nameIn.value.trim();
      const desc = descIn.value.trim();
      fieldError(nameIn, $("team-name-error"), name ? "" : "Give the team a name.");
      if (!name) { nameIn.focus(); return; }
      $("team-form-error").hidden = true;

      KF.withLoading($("team-submit"), async function () {
        try {
          const team = await KF.api("/api/teams", { json: { teamName: name, teamDescription: desc } });
          // The new team's page is where you add spaces and invite people
          location.href = team && team.id ? "/team.html?id=" + encodeURIComponent(team.id) : "/dashboard.html";
        } catch (err) {
          $("team-form-error-msg").textContent = "Couldn't create the team. " + err.message;
          $("team-form-error").hidden = false;
        }
      });
    });

    KF.initShell({ active: "dashboard", breadcrumbs: [{ label: "Dashboard" }] }).then(function (s) {
      shellReady = true;
      $("greeting").textContent = greeting(s.me);
      return load();
    }, showLoadError);
  })();
</script>
</body>
</html>

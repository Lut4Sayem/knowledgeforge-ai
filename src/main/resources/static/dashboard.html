<!DOCTYPE html>
<html>
<head>
    <title>KnowledgeForge AI - Dashboard</title>
    <link rel="stylesheet" href="/style.css">
    <meta charset="utf-8">
</head>
<body>

<div class="dashboard-container">

    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
        <div>
            <h2 style="margin-bottom:6px;">KnowledgeForge AI</h2>
            <p id="welcomeText" style="margin-top:0;"></p>
        </div>

        <div style="display:flex; gap:10px; align-items:center;">
            <a href="/search.html" style="text-decoration:none;">
                <button type="button">Search</button>
            </a>
            <button onclick="logout()">Log out</button>
        </div>
    </div>

    <hr>

    <!-- SUMMARY -->
    <h3>Summary</h3>
    <div id="summaryRow" style="display:flex; gap: 15px; flex-wrap: wrap;">
        <div style="border:1px solid #ccc; padding:12px; border-radius:8px; min-width:160px; background:#f9f9f9;">
            <div style="font-size:13px; color:#555;">Teams</div>
            <div id="teamCount" style="font-size:22px; font-weight:bold;">0</div>
        </div>
        <div style="border:1px solid #ccc; padding:12px; border-radius:8px; min-width:160px; background:#f9f9f9;">
            <div style="font-size:13px; color:#555;">Spaces</div>
            <div id="spaceCount" style="font-size:22px; font-weight:bold;">0</div>
        </div>
        <div style="border:1px solid #ccc; padding:12px; border-radius:8px; min-width:160px; background:#f9f9f9;">
            <div style="font-size:13px; color:#555;">Documents</div>
            <div id="documentCount" style="font-size:22px; font-weight:bold;">0</div>
        </div>
    </div>

    <hr>

    <!-- RECENT DOCS -->
    <h3>Recently Updated Documents</h3>
    <div id="recentDocsContainer" style="display:flex; flex-direction:column; gap:10px;">
        <p>Loading recent documents...</p>
    </div>

    <hr>

    <!-- RECENT ACTIVITY -->
    <h3>Recent Activity</h3>
    <div id="activityContainer" style="display:flex; flex-direction:column; gap:10px;">
        <p>Loading activity...</p>
    </div>

    <hr>

    <h3>My Teams</h3>

    <div id="teamsContainer" style="display: flex; gap: 15px; flex-wrap: wrap;">
        <p>Loading teams...</p>
    </div>

    <hr>

    <h3>Create Team</h3>

    <form id="teamForm">
        <label>Team Name</label>
        <input type="text" id="teamName" required>

        <label>Description</label>
        <textarea id="teamDescription" rows="3" required></textarea>

        <button type="submit">Create Team</button>
    </form>

    <p id="teamMessage"></p>

</div>

<script>
    const welcomeText = document.getElementById("welcomeText");

    async function fetchJson(url, options = {}) {
        const res = await fetch(url, { credentials: "include", ...options });

        if (res.status === 401) {
            window.location.href = "/login.html";
            return null;
        }

        const text = await res.text();
        let data = null;

        if (text) {
            try { data = JSON.parse(text); } catch (e) { data = null; }
        }

        if (!res.ok) {
            const msg = (data && (data.message || data.error))
                ? (data.message || data.error)
                : ("Request failed: " + res.status);
            throw new Error(msg);
        }

        // success but empty body
        if (!text) return null;

        // success but not JSON
        if (data === null) {
            throw new Error("Unexpected response (not JSON). Please log in again.");
        }

        return data;
    }

    async function checkAuth() {
        const data = await fetchJson("/api/me");
        if (!data) return;

        const label = data.fullName ? data.fullName : data.email;
        welcomeText.innerText = "Welcome, " + label;
    }

    function formatAction(action) {
        if (!action) return "";
        if (action === "CREATE_DOCUMENT") return "created a document";
        if (action === "UPDATE_DOCUMENT") return "updated a document";
        if (action === "DELETE_DOCUMENT") return "deleted a document";
        if (action === "RESTORE_DOCUMENT") return "restored a document version";
        return action;
    }

    async function loadDashboard() {
        const teamCountEl = document.getElementById("teamCount");
        const spaceCountEl = document.getElementById("spaceCount");
        const documentCountEl = document.getElementById("documentCount");
        const recentBox = document.getElementById("recentDocsContainer");
        const activityBox = document.getElementById("activityContainer");

        try {
            const data = await fetchJson("/api/dashboard");
            if (!data) return;

            teamCountEl.textContent = data.teamCount ?? 0;
            spaceCountEl.textContent = data.spaceCount ?? 0;
            documentCountEl.textContent = data.documentCount ?? 0;

            // ----- recent documents -----
            const recent = Array.isArray(data.recentDocuments) ? data.recentDocuments : [];
            recentBox.innerHTML = "";

            if (recent.length === 0) {
                recentBox.innerHTML = "<p>No documents yet.</p>";
            } else {
                recent.forEach(r => {
                    const div = document.createElement("div");
                    div.style.border = "1px solid #ccc";
                    div.style.padding = "12px";
                    div.style.borderRadius = "8px";
                    div.style.backgroundColor = "#f9f9f9";

                    const updated = r.updatedAt ? new Date(r.updatedAt).toLocaleString() : "";
                    const teamName = r.teamName || "";
                    const spaceName = r.spaceName || "";
                    const status = r.status || "";
                    const title = r.title || "(No title)";
                    const docId = r.documentId || r.id || r._id;

                    const tags = Array.isArray(r.tags) ? r.tags : [];
                    const tagsHtml = tags.length
                        ? tags.map(t => `<span style="display:inline-block; background:#eee; padding:3px 8px; border-radius:12px; margin-right:6px; font-size:12px;">${t}</span>`).join("")
                        : "";

                    div.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
                            <div style="flex:1;">
                                <div style="font-weight:bold; font-size:16px;">${title}</div>
                                <div style="font-size:13px; color:#555; margin-top:4px;">
                                    ${teamName ? (teamName + " • ") : ""}${spaceName ? spaceName : ""}${status ? (" • " + status) : ""}
                                </div>
                                <div style="margin-top:8px;">${tagsHtml}</div>
                                <div style="font-size:12px; color:#777; margin-top:8px;">
                                    Updated: ${updated}
                                </div>
                            </div>
                            <div>
                                <button type="button" class="openDocBtn">Open</button>
                            </div>
                        </div>
                    `;

                    div.querySelector(".openDocBtn").addEventListener("click", () => {
                        window.location.href = `/document.html?id=${docId}&mode=view`;
                    });

                    recentBox.appendChild(div);
                });
            }

            // ----- recent activity -----
            const activity = Array.isArray(data.recentActivity) ? data.recentActivity : [];
            activityBox.innerHTML = "";

            if (activity.length === 0) {
                activityBox.innerHTML = "<p>No activity yet.</p>";
            } else {
                activity.forEach(a => {
                    const div = document.createElement("div");
                    div.style.border = "1px solid #ccc";
                    div.style.padding = "12px";
                    div.style.borderRadius = "8px";
                    div.style.backgroundColor = "#f9f9f9";

                    const when = a.createdAt ? new Date(a.createdAt).toLocaleString() : "";
                    const actor = a.actorFullName || a.actorEmail || "Someone";
                    const teamName = a.teamName || "";
                    const actionText = formatAction(a.action);
                    const title = a.targetTitle || "(Untitled)";
                    const docId = a.targetId;

                    div.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
                            <div style="flex:1;">
                                <div style="font-weight:bold; font-size:15px;">
                                    ${actor} ${actionText}
                                </div>
                                <div style="margin-top:6px;">
                                    <span style="font-weight:bold;">${title}</span>
                                </div>
                                <div style="font-size:12px; color:#777; margin-top:6px;">
                                    ${teamName ? ("Team: " + teamName + " • ") : ""}${when}
                                </div>
                            </div>
                            <div>
                                ${docId ? `<button type="button" class="openFromActivityBtn">Open</button>` : ""}
                            </div>
                        </div>
                    `;

                    const btn = div.querySelector(".openFromActivityBtn");
                    if (btn) {
                        btn.addEventListener("click", () => {
                            window.location.href = `/document.html?id=${docId}&mode=view`;
                        });
                    }

                    activityBox.appendChild(div);
                });
            }

        } catch (err) {
            recentBox.innerHTML = `<p style="color:red;">Failed to load dashboard: ${err.message}</p>`;
            activityBox.innerHTML = `<p style="color:red;">Failed to load activity: ${err.message}</p>`;
        }
    }

    async function loadTeams() {
        const teamsContainer = document.getElementById("teamsContainer");

        try {
            const teams = await fetchJson("/api/teams");
            if (!teams) return;

            teamsContainer.innerHTML = "";

            if (teams.length === 0) {
                teamsContainer.innerHTML = "<p>You are not in any teams yet.</p>";
                return;
            }

            teams.forEach(team => {
                const teamCard = document.createElement("div");

                teamCard.style.border = "1px solid #ccc";
                teamCard.style.padding = "15px";
                teamCard.style.borderRadius = "8px";
                teamCard.style.minWidth = "200px";
                teamCard.style.backgroundColor = "#f9f9f9";

                teamCard.innerHTML = `
                    <h4 style="margin-top: 0;">
                        ${team.name}
                    </h4>

                    <p style="font-size: 13px; color: #555;">
                        ${team.description}
                    </p>

                    <button
                        onclick="openTeam('${team.id}')"
                        style="margin-top: 10px;">
                        Open
                    </button>
                `;

                teamsContainer.appendChild(teamCard);
            });

        } catch (err) {
            teamsContainer.innerHTML =
                "<p style='color: red;'>Failed to load teams.</p>";
        }
    }

    function openTeam(teamId) {
        window.location.href = "/team.html?id=" + teamId;
    }

    const teamForm = document.getElementById("teamForm");
    const teamMessage = document.getElementById("teamMessage");

    teamForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const teamName = document.getElementById("teamName").value;
        const teamDescription = document.getElementById("teamDescription").value;

        try {
            await fetchJson("/api/teams", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    teamName: teamName,
                    teamDescription: teamDescription
                })
            });

            teamMessage.innerText = "Team created successfully ✅";
            teamMessage.style.color = "green";
            teamForm.reset();

            // Reload data
            loadTeams();
            loadDashboard();

        } catch (err) {
            teamMessage.innerText = "Failed to create team: " + err.message;
            teamMessage.style.color = "red";
        }
    });

    async function logout() {
        try {
            await fetch("/logout", { method: "POST", credentials: "include" });
        } catch (e) {}
        window.location.href = "/login.html";
    }

    (async function init() {
        await checkAuth();
        await loadDashboard();
        await loadTeams();
    })();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnowledgeForge - Sign In</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">

<div class="auth-card">
    <div class="auth-header">
        <h1>KnowledgeForge</h1>
        <p>Sign in to your workspace</p>
    </div>

    <!-- Error Message Container (Hidden by default) -->
    <div id="message" class="alert-error" style="display: none;"></div>

    <form id="loginForm">
        <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: baseline;">
                <label for="password" class="form-label">Password</label>
                <!-- Mock forgot password link to match design -->
                <a href="#" style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Forgot?</a>
            </div>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full" style="margin-top: 8px;">LOG IN</button>
    </form>

    <div class="auth-footer">
        Don't have an account? <a href="/register.html" style="font-weight: 600;">Register</a>
    </div>
</div>

<script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        // Clear previous errors
        message.style.display = "none";
        message.innerHTML = "";

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const response = await fetch("/api/auth/login", {
            method: "POST",
            credentials: "include",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                password: password
            })
        });

        if (response.ok) {
            window.location.href = "/dashboard.html";
        } else {
            // Display the red alert banner styled like the design reference
            message.style.display = "flex";
            message.innerHTML = `
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span>Invalid credentials. Please try again.</span>
                `;
        }
    });
</script>

</body>
</html>

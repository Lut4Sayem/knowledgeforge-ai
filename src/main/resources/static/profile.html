<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile · KnowledgeForge</title>
  <meta name="description" content="Your KnowledgeForge profile and team memberships.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="main" class="page">

  <header class="page-header" id="header">
    <div class="page-header__title" style="min-width: 0">
      <span id="avatar"><span class="skeleton skeleton--avatar" style="display: block; width: 40px; height: 40px"></span></span>
      <div style="min-width: 0">
        <h1 class="title-lg truncate" id="name"><span class="skeleton skeleton--title" style="display: block; width: 200px; height: 24px"></span></h1>
        <p class="caption text-steel truncate" id="email"></p>
      </div>
    </div>
  </header>

  <div class="error-state" id="load-error" role="alert" hidden>
    <span id="load-error-icon"></span>
    <span class="error-state__msg" id="load-error-msg"></span>
    <button type="button" class="btn btn--secondary btn--sm" onclick="location.reload()">Try again</button>
  </div>

  <div class="layout-aside" id="content">
    <section aria-labelledby="details-title">
      <div class="section__header"><h2 class="title-md" id="details-title">Details</h2></div>
      <form class="card" id="profile-form" novalidate>
          <div class="field">
            <label class="label" for="full-name">Name</label>
            <input class="input" id="full-name" maxlength="100" autocomplete="name" aria-required="true" aria-describedby="full-name-error">
            <p class="field__error" id="full-name-error" hidden></p>
          </div>
          <div class="field">
            <label class="label" for="email-field">Email</label>
            <input class="input" id="email-field" type="email" readonly aria-describedby="email-hint">
            <p class="hint" id="email-hint">You log in with this. It can't be changed.</p>
          </div>
          <div class="field">
            <span class="label" id="picture-label">Picture <span class="text-steel">(optional)</span></span>
            <div class="btn-row">
              <span id="picture-preview"></span>
              <input type="file" id="picture-file" hidden accept=".png,.jpg,.jpeg,.gif,.webp" aria-labelledby="picture-label">
              <button type="button" class="btn btn--secondary btn--sm" id="picture-upload">Upload picture</button>
              <button type="button" class="btn btn--ghost btn--sm" id="picture-remove" hidden>Remove</button>
            </div>
            <p class="hint" id="picture-hint">PNG, JPG, GIF or WebP, up to 2 MB. It saves right away. Without one, teammates see your initials.</p>
            <p class="field__error" id="picture-error" role="alert" hidden></p>
          </div>
          <div class="error-state" id="save-error" role="alert" hidden style="margin-top: var(--space-4)">
            <span id="save-error-icon"></span><span class="error-state__msg" id="save-error-msg"></span>
          </div>
          <div class="btn-row" style="margin-top: var(--space-5)">
            <button type="submit" class="btn btn--primary" id="save-btn" disabled>Save changes</button>
            <span class="hint" id="save-state" aria-live="polite"></span>
          </div>
      </form>
    </section>

    <div class="layout-aside__side">
      <section class="section" aria-labelledby="teams-title">
        <div class="section__header"><h2 class="title-md" id="teams-title">Your teams</h2></div>
        <div class="card card--flush" id="teams" aria-busy="true">
          <div class="skeleton-row"><span class="skeleton skeleton--line"></span></div>
          <div class="skeleton-row"><span class="skeleton skeleton--line"></span></div>
        </div>
      </section>

    </div>
  </div>
</main>

<script src="/app.js"></script>
<script>
  (function () {
    const esc = KF.escapeHtml;
    const $ = function (id) { return document.getElementById(id); };
    ["load-error-icon", "save-error-icon"].forEach(function (id) { $(id).outerHTML = KF.icon("alert-circle"); });

    let me = null;

    function setField(id, msg) {
      const input = $(id);
      const err = $(id + "-error");
      input.setAttribute("aria-invalid", msg ? "true" : "false");
      err.hidden = !msg;
      err.innerHTML = msg ? KF.icon("alert-circle", "icon--sm") + esc(msg) : "";
    }

    function renderHeader(user) {
      const name = user.fullName || user.email || "Your profile";
      $("avatar").innerHTML = KF.avatar(user, "lg");
      $("name").textContent = name;
      $("email").textContent = user.fullName ? user.email || "" : "";
    }

    function renderSidebarUser(user) {
      const link = document.querySelector("#kf-sidebar .sidebar__user");
      if (link) link.innerHTML = KF.avatar(user, "sm") + '<span class="sidebar__user-name truncate body-medium">' + esc(user.fullName || user.email || "") + "</span>";
    }

    function dirty() {
      return me && $("full-name").value.trim() !== (me.fullName || "");
    }

    function refreshState() {
      $("save-state").textContent = dirty() ? "Unsaved changes" : "";
      $("save-btn").disabled = !dirty();
    }

    function validate() {
      const name = $("full-name").value.trim();
      const nameErr = name ? "" : "Enter your name. Teammates see it on documents and comments.";
      setField("full-name", nameErr);
      if (nameErr) $("full-name").focus();
      return !nameErr;
    }

    $("full-name").addEventListener("input", function () { if ($("full-name").value.trim()) setField("full-name", ""); refreshState(); });

    /* ---------- Picture: uploads on pick, separate from the name form ---------- */
    const PIC_TYPES = /\.(png|jpe?g|gif|webp)$/i;
    const PIC_MAX = 2 * 1024 * 1024;

    function pictureError(msg) {
      $("picture-error").hidden = !msg;
      $("picture-error").innerHTML = msg ? KF.icon("alert-circle", "icon--sm") + esc(msg) : "";
    }

    function renderPicture() {
      $("picture-preview").innerHTML = KF.avatar(me, "lg");
      $("picture-upload").textContent = me.profilePicture ? "Change picture" : "Upload picture";
      $("picture-remove").hidden = !me.profilePicture;
    }

    // Keep the typed name; only the picture changed
    function applySaved(saved) {
      me = Object.assign({}, me, { profilePicture: saved && saved.profilePicture });
      renderPicture();
      renderHeader(me);
      renderSidebarUser(me);
    }

    $("picture-upload").addEventListener("click", function () { $("picture-file").click(); });

    $("picture-file").addEventListener("change", function () {
      const file = $("picture-file").files[0];
      $("picture-file").value = ""; // picking the same file again still fires change
      if (!file) return;
      pictureError("");
      if (!PIC_TYPES.test(file.name)) { pictureError("Use a PNG, JPG, GIF or WebP image."); return; }
      if (file.size > PIC_MAX) { pictureError("That picture is " + KF.formatSize(file.size) + ". The limit is 2 MB."); return; }
      const form = new FormData();
      form.append("file", file);
      KF.withLoading($("picture-upload"), async function () {
        try {
          applySaved(await KF.api("/api/me/picture", { method: "POST", body: form }));
          KF.toast("Picture updated.");
        } catch (err) {
          pictureError("Couldn't upload the picture. " + err.message);
        }
      }).then(renderPicture);
    });

    $("picture-remove").addEventListener("click", async function () {
      const ok = await KF.confirmDialog({
        title: "Remove your picture?",
        message: "Teammates will see your initials instead.",
        confirmLabel: "Remove picture"
      });
      if (!ok) return;
      pictureError("");
      KF.withLoading($("picture-remove"), async function () {
        try {
          applySaved(await KF.api("/api/me/picture", { method: "DELETE" }));
          KF.toast("Picture removed.");
          $("picture-upload").focus(); // the Remove button is gone now
        } catch (err) {
          pictureError("Couldn't remove the picture. " + err.message);
        }
      });
    });

    $("profile-form").addEventListener("submit", function (e) {
      e.preventDefault();
      $("save-error").hidden = true;
      if (!validate()) return;
      KF.withLoading($("save-btn"), async function () {
        try {
          const saved = await KF.api("/api/me", {
            method: "PUT",
            json: { fullName: $("full-name").value.trim() }
          });
          me = saved || me;
          $("full-name").value = me.fullName || "";
          renderHeader(me);
          renderSidebarUser(me);
          refreshState();
          KF.toast("Profile saved.");
        } catch (err) {
          $("save-error-msg").textContent = "Couldn't save your profile. " + err.message;
          $("save-error").hidden = false;
        }
      }).then(refreshState);
    });


    window.addEventListener("beforeunload", function (e) {
      if (dirty()) { e.preventDefault(); e.returnValue = ""; }
    });

    function renderTeams(teams) {
      const box = $("teams");
      box.removeAttribute("aria-busy");
      if (!teams.length) {
        box.innerHTML = '<div class="empty"><span class="empty__icon">' + KF.icon("users") + '</span>' +
          '<h3 class="title-sm">No teams yet</h3><p class="empty__text">Create a team from the dashboard, or open an invite link from a teammate.</p>' +
          '<a class="btn btn--secondary btn--sm" href="/dashboard.html">Go to dashboard</a></div>';
        return;
      }
      // Unnamed teams last
      const sorted = teams.slice().sort(function (a, b) { return !a.teamName - !b.teamName || String(a.teamName || "").localeCompare(String(b.teamName || "")); });
      box.innerHTML = '<ul class="list" role="list">' + sorted.map(function (t) {
        const name = t.teamName || "Untitled team";
        const role = String(t.role || "VIEWER").toUpperCase();
        return '<li><a class="list-row" href="/team.html?id=' + encodeURIComponent(t.teamId) + '">' + KF.teamIcon(t.teamName, "sm") +
          '<span class="list-row__main"><span class="list-row__title">' + esc(name) + "</span></span>" +
          '<span class="badge badge--' + esc(role.toLowerCase()) + '">' + esc(role.charAt(0) + role.slice(1).toLowerCase()) + "</span></a></li>";
      }).join("") + "</ul>";
    }

    KF.initShell({ active: "profile", breadcrumbs: [{ label: "Profile" }] }).then(function (s) {
      me = s.me || {};
      renderHeader(me);
      $("full-name").value = me.fullName || "";
      $("email-field").value = me.email || "";
      renderPicture();
      refreshState();
      renderTeams(s.teams);
    }, function (err) {
      $("header").hidden = true;
      $("content").hidden = true;
      $("load-error-msg").textContent = "Couldn't load your profile. " + err.message;
      $("load-error").hidden = false;
    });
  })();
</script>
</body>
</html>

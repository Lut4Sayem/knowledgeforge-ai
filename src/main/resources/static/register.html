<!DOCTYPE html>
<html>
<head>
    <title>KnowledgeForge AI - Register</title>
    <link rel="stylesheet" href="/style.css">
    <meta charset="UTF-8">
</head>
<body class="auth-body">

<div class="auth-card">
    <h2>◇ KnowledgeForge AI</h2>
    <p>Get started in seconds</p>

    <form id="registerForm">
        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="Jane Doe" required>

        <label>Email</label>
        <input type="email" id="email" placeholder="you@company.com" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="********" required>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="********" required>

        <button type="submit">Register</button>
    </form>

    <p id="message"></p>

    <p>Already have an account? <a href="/login.html">Log in</a></p>
</div>

<script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        const fullName = document.getElementById("fullName").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            message.innerText = "Passwords do not match.";
            return;
        }

        const response = await fetch("/api/auth/register", {
            method: "POST",
            credentials: "include",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                fullName: fullName,
                email: email,
                password: password
            })
        });

        if (response.ok) {
            message.innerText = "Registration successful. Redirecting to login...";
            setTimeout(function () {
                window.location.href = "/login.html";
            }, 1000);
        } else if (response.status === 409) {
            message.innerText = "Email already exists.";
        } else {
            message.innerText = "Registration failed.";
        }
    });
</script>

</body>
</html>

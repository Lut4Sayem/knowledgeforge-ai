<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KnowledgeForge - Document</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        /* ── Document-page only styles ── */
        .error-box {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            padding: 12px 16px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        /* ── VIEW MODE: Article layout ── */
        .doc-article {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 48px 56px;
            max-width: 780px;
        }

        .doc-tags-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .doc-tag {
            display: inline-block;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            background: var(--bg-canvas);
        }

        .doc-view-title {
            font-family: var(--font-serif);
            font-size: 36px;
            font-weight: 700;
            line-height: 1.15;
            color: var(--text-heading);
            margin-bottom: 16px;
        }

        .doc-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .doc-meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Rendered markdown body */
        .doc-body {
            font-size: 15px;
            line-height: 1.75;
            color: var(--text-main);
        }

        .doc-body h1, .doc-body h2, .doc-body h3 {
            font-family: var(--font-serif);
            margin: 28px 0 12px;
            color: var(--text-heading);
        }

        .doc-body p { margin: 0 0 16px; }

        .doc-body pre {
            background: #F4F1EA;
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            font-family: "Courier New", monospace;
            font-size: 13px;
            overflow-x: auto;
            margin: 20px 0;
        }

        .doc-body code {
            background: #F4F1EA;
            padding: 2px 6px;
            font-family: "Courier New", monospace;
            font-size: 13px;
        }

        .doc-body blockquote {
            border-left: 3px solid var(--primary);
            margin: 16px 0;
            padding: 8px 16px;
            color: var(--text-muted);
            font-style: italic;
        }

        .doc-body ul, .doc-body ol {
            padding-left: 24px;
            margin: 0 0 16px;
        }

        /* Attachments in view */
        .attachment-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 12px;
            color: var(--text-main);
            margin-right: 8px;
            margin-bottom: 8px;
            text-decoration: none;
            background: var(--bg-card);
            transition: background 0.15s;
        }
        .attachment-chip:hover {
            background: var(--bg-active);
            text-decoration: none;
        }

        .attachment-size {
            color: var(--text-muted);
            font-size: 11px;
        }

        /* Section dividers */
        .doc-section {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .doc-section-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        /* Comments */
        .comment-item {
            padding: 14px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .comment-item:last-child { border-bottom: none; }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .comment-author { font-weight: 600; font-size: 13px; }
        .comment-time { font-size: 11px; color: var(--text-muted); }
        .comment-body { font-size: 13px; line-height: 1.5; white-space: pre-wrap; }

        .btn-del-comment {
            background: none;
            border: none;
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
        }
        .btn-del-comment:hover { color: var(--error-text); }

        /* Versions */
        .version-row {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .version-row:last-child { border-bottom: none; }

        .version-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .version-label { font-weight: 600; font-size: 13px; }
        .version-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

        .version-actions { display: flex; gap: 8px; }

        .btn-version {
            background: none;
            border: 1px solid var(--border-color);
            font-size: 11px;
            padding: 4px 10px;
            cursor: pointer;
            color: var(--text-main);
            transition: background 0.15s;
        }
        .btn-version:hover { background: var(--bg-active); }

        .version-preview-box {
            display: none;
            margin-top: 12px;
            padding: 16px;
            background: var(--bg-canvas);
            border: 1px solid var(--border-color);
            font-size: 13px;
        }

        /* ── EDIT MODE layout ── */
        .editor-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 860px) {
            .editor-layout { grid-template-columns: 1fr; }
            .doc-article { padding: 28px 20px; }
        }

        .editor-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 24px;
        }

        .editor-panel-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .editor-textarea {
            width: 100%;
            min-height: 320px;
            resize: vertical;
            padding: 12px;
            border: 1px solid var(--border-color);
            font-family: "Courier New", monospace;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-main);
            background: #FEFEFE;
            outline: none;
        }
        .editor-textarea:focus { border-color: var(--primary); }

        textarea.comment-box {
            min-height: 72px;
            resize: none;
        }

        /* Edit topbar action row */
        .edit-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .edit-breadcrumb {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Attachment table in edit mode */
        .attach-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 12px;
        }
        .attach-table th {
            text-align: left;
            padding: 6px 8px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }
        .attach-table td {
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
            word-break: break-all;
        }
        .attach-table tr:last-child td { border-bottom: none; }

        .btn-del-attach {
            background: none;
            border: none;
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
        }
        .btn-del-attach:hover { color: var(--error-text); }

        /* Save message */
        .save-msg {
            font-size: 12px;
            color: var(--badge-green-text);
            font-weight: 600;
        }

        /* Edit button in view mode topbar */
        .edit-btn-topbar {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            border: 1px solid var(--primary);
            background: var(--primary);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            cursor: pointer;
            text-decoration: none;
        }
        .edit-btn-topbar:hover {
            background: var(--primary-hover);
            text-decoration: none;
        }
    </style>
</head>

<!-- Markdown renderer -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
    const params     = new URLSearchParams(window.location.search);
    const documentId = params.get("id");
    const mode       = params.get("mode") || "view";

    /* ── Make documentId accessible to inline onclick ── */
    window.documentId = documentId;

    function showError(message) {
        const box = document.getElementById("errorBox");
        box.style.display = "block";
        box.textContent = message;
    }

    function clearError() {
        const box = document.getElementById("errorBox");
        box.style.display = "none";
        box.textContent = "";
    }

    function timeAgo(dateStr) {
        if (!dateStr) return "—";
        const date = new Date(dateStr);
        const seconds = Math.floor((new Date() - date) / 1000);
        if (seconds < 60) return "just now";
        const mins = Math.floor(seconds / 60);
        if (mins < 60) return mins + " min ago";
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return hrs + " hour" + (hrs > 1 ? "s" : "") + " ago";
        const days = Math.floor(hrs / 24);
        if (days === 1) return "Yesterday";
        if (days < 30) return days + " days ago";
        return date.toLocaleDateString("en-US",
            { month: "short", day: "numeric", year: "numeric" });
    }

    async function fetchJson(url, options = {}) {
        const response = await fetch(url, { credentials: "include", ...options });
        if (response.status === 401) {
            window.location.href = "/login.html";
            return null;
        }
        const text = await response.text();
        if (response.ok && !text) return null;
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) {}
        if (!response.ok) {
            throw new Error(
                (data && (data.message || data.error))
                    ? (data.message || data.error)
                    : ("Request failed: " + response.status)
            );
        }
        return data;
    }

    function renderMarkdown(md) {
        if (window.marked) {
            marked.setOptions({ breaks: true });
            return marked.parse(md || "");
        }
        return (md || "");
    }

    /* ── Sidebar teams ── */
    async function loadSidebarTeams() {
        try {
            const teams = await fetchJson("/api/teams");
            const box = document.getElementById("sidebarTeams");
            box.innerHTML = "";
            if (!teams || teams.length === 0) {
                box.innerHTML = `<div style="padding:6px 8px;font-size:12px;
                    color:var(--text-muted);">No teams</div>`;
                return;
            }
            teams.forEach(t => {
                const a = document.createElement("a");
                a.href = "/team.html?id=" + t.id;
                a.style.cssText = "display:block;padding:6px 8px;font-size:12px;" +
                    "color:var(--text-main);text-decoration:none;";
                a.textContent = "• " + (t.name || "(Unnamed)");
                a.onmouseover = () => a.style.background = "var(--bg-active)";
                a.onmouseout  = () => a.style.background = "";
                box.appendChild(a);
            });
        } catch (e) {}
    }

    /* ── Top avatar ── */
    async function loadMe() {
        try {
            const me = await fetchJson("/api/me");
            if (!me) return;
            const el = document.getElementById("topAvatar");
            if (me.profilePicture) {
                el.innerHTML = `<img src="${me.profilePicture}" alt=""
                    style="width:100%;height:100%;object-fit:cover;"
                    onerror="this.parentElement.textContent='?'">`;
            } else {
                const name = (me.fullName || me.email || "?");
                const parts = name.trim().split(" ");
                el.textContent = parts.length >= 2
                    ? (parts[0][0] + parts[1][0]).toUpperCase()
                    : name.substring(0, 2).toUpperCase();
            }
        } catch (e) {}
    }

    /* ══════════════════════════════════════
       ATTACHMENTS
    ══════════════════════════════════════ */
    async function loadAttachments() {
        const list = await fetchJson(`/api/documents/${documentId}/attachments`);
        renderAttachments(list || []);
    }

    function renderAttachments(list) {
        /* EDIT table */
        const tbody     = document.getElementById("attachmentsEditTbody");
        const emptyEdit = document.getElementById("attachmentsEditEmpty");

        if (tbody && emptyEdit) {
            tbody.innerHTML = "";
            if (!list.length) {
                emptyEdit.style.display = "block";
            } else {
                emptyEdit.style.display = "none";
                for (const a of list) {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td>${a.originalName || ""}</td>
                        <td><a href="${a.url || "#"}" target="_blank"
                               style="color:var(--primary);font-size:11px;">
                            ${(a.url || "").substring(0, 40)}${a.url && a.url.length > 40 ? "…" : ""}
                        </a></td>
                        <td><button class="btn-del-attach delAttachBtn" type="button">✕</button></td>
                    `;
                    tr.querySelector(".delAttachBtn").addEventListener("click", async () => {
                        if (!confirm("Delete this attachment?")) return;
                        clearError();
                        try {
                            await fetchJson(`/api/attachments/${a.id || a._id}`,
                                { method: "DELETE" });
                            await loadAttachments();
                        } catch (err) { showError(err.message); }
                    });
                    tbody.appendChild(tr);
                }
            }
        }

        /* VIEW chips */
        const viewList  = document.getElementById("attachmentsViewList");
        const emptyView = document.getElementById("attachmentsViewEmpty");

        if (viewList && emptyView) {
            viewList.innerHTML = "";
            if (!list.length) {
                emptyView.style.display = "block";
            } else {
                emptyView.style.display = "none";
                for (const a of list) {
                    const chip = document.createElement("a");
                    chip.className = "attachment-chip";
                    chip.href = a.url || "#";
                    chip.target = "_blank";
                    chip.innerHTML = `
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                             stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12
                                     a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        <span>${a.originalName || a.url || ""}</span>
                    `;
                    viewList.appendChild(chip);
                }
            }
        }
    }

    async function addAttachment() {
        const name = document.getElementById("attachNameInput").value.trim();
        const url  = document.getElementById("attachUrlInput").value.trim();
        if (!name || !url) { showError("Attachment name and URL are required."); return; }
        clearError();
        try {
            await fetchJson(`/api/documents/${documentId}/attachments`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ originalName: name, url })
            });
            document.getElementById("attachNameInput").value = "";
            document.getElementById("attachUrlInput").value  = "";
            await loadAttachments();
        } catch (err) { showError(err.message); }
    }

    /* ══════════════════════════════════════
       COMMENTS
    ══════════════════════════════════════ */
    async function loadComments() {
        const list = await fetchJson(`/api/documents/${documentId}/comments`);
        renderComments(Array.isArray(list) ? list : []);
    }

    function renderComments(list) {
        ["commentsBox", "commentsBoxView"].forEach(boxId => {
            const box = document.getElementById(boxId);
            if (!box) return;
            box.innerHTML = "";

            if (list.length === 0) {
                box.innerHTML = `<p style="color:var(--text-muted);font-size:13px;">
                    No comments yet.</p>`;
                return;
            }

            for (const c of list) {
                const div = document.createElement("div");
                div.className = "comment-item";
                const name = c.createdByFullName || c.createdByEmail || "Unknown";
                const when = c.createdAt ? timeAgo(new Date(c.createdAt)) : "";

                div.innerHTML = `
                    <div class="comment-header">
                        <div>
                            <div class="comment-author">${name}</div>
                            <div class="comment-time">${when}</div>
                        </div>
                        <button class="btn-del-comment delCommentBtn" type="button">Delete</button>
                    </div>
                    <div class="comment-body">${c.content || ""}</div>
                `;

                div.querySelector(".delCommentBtn").addEventListener("click", async () => {
                    if (!confirm("Delete this comment?")) return;
                    clearError();
                    try {
                        await fetchJson(`/api/comments/${c.id}`, { method: "DELETE" });
                        await loadComments();
                    } catch (err) { showError(err.message); }
                });
                box.appendChild(div);
            }
        });
    }

    async function addCommentFrom(textareaId) {
        const ta = document.getElementById(textareaId);
        if (!ta) return;
        const content = ta.value.trim();
        if (!content) { showError("Comment cannot be empty."); return; }
        clearError();
        try {
            await fetchJson(`/api/documents/${documentId}/comments`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content })
            });
            ta.value = "";
            await loadComments();
        } catch (err) { showError(err.message); }
    }

    /* ══════════════════════════════════════
       VERSIONS
    ══════════════════════════════════════ */
    async function loadVersions() {
        const list = await fetchJson(`/api/documents/${documentId}/versions`);
        renderVersions(Array.isArray(list) ? list : []);
    }

    function renderVersions(list) {
        ["versionsBox", "versionsBoxView"].forEach(boxId => {
            const box = document.getElementById(boxId);
            if (!box) return;
            box.innerHTML = "";

            if (list.length === 0) {
                box.innerHTML = `<p style="color:var(--text-muted);font-size:13px;">
                    No versions yet.</p>`;
                return;
            }

            for (const v of list) {
                const div = document.createElement("div");
                div.className = "version-row";
                const who  = v.savedByFullName || v.savedByEmail || "Unknown";
                const when = v.savedAt ? timeAgo(new Date(v.savedAt)) : "";

                div.innerHTML = `
                    <div class="version-header">
                        <div>
                            <div class="version-label">Version ${v.versionNumber ?? ""}</div>
                            <div class="version-meta">Saved by ${who} · ${when}</div>
                        </div>
                        <div class="version-actions">
                            <button class="btn-version previewVersionBtn" type="button">
                                Preview
                            </button>
                            ${mode === "edit"
                    ? `<button class="btn-version restoreBtn" type="button">
                                       Restore
                                   </button>`
                    : ""}
                        </div>
                    </div>
                    <div class="version-preview-box">
                        <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">
                            Snapshot — v${v.versionNumber}
                        </div>
                        <div style="font-family:var(--font-serif);font-size:18px;
                                    font-weight:600;margin-bottom:12px;">
                            ${v.title || "(No title)"}
                        </div>
                        <div class="doc-body">${renderMarkdown(v.content || "")}</div>
                    </div>
                `;

                div.querySelector(".previewVersionBtn").addEventListener("click", () => {
                    const pb = div.querySelector(".version-preview-box");
                    pb.style.display = pb.style.display === "none" ? "block" : "none";
                });

                if (mode === "edit") {
                    div.querySelector(".restoreBtn").addEventListener("click", async () => {
                        if (!confirm(`Restore version ${v.versionNumber}?`)) return;
                        clearError();
                        try {
                            await fetchJson(
                                `/api/documents/${documentId}/versions/${v.id}/restore`,
                                { method: "POST" }
                            );
                            await loadDocument();
                        } catch (err) { showError(err.message); }
                    });
                }

                box.appendChild(div);
            }
        });
    }

    /* ══════════════════════════════════════
       PREVIEW (edit mode live update)
    ══════════════════════════════════════ */
    function updatePreview() {
        const title    = document.getElementById("titleInput").value;
        const content  = document.getElementById("contentInput").value;
        const tagsText = document.getElementById("tagsInput").value;

        document.getElementById("previewTitle").textContent = title;
        document.getElementById("previewContent").innerHTML = renderMarkdown(content);

        const tagsContainer = document.getElementById("previewTags");
        tagsContainer.innerHTML = "";
        tagsText.split(",").map(t => t.trim()).filter(Boolean).forEach(tag => {
            const span = document.createElement("span");
            span.className = "doc-tag";
            span.textContent = "#" + tag;
            tagsContainer.appendChild(span);
        });
    }

    /* ══════════════════════════════════════
       LOAD DOCUMENT
    ══════════════════════════════════════ */
    async function loadDocument() {
        if (!documentId) { showError("Document ID is missing from URL."); return; }

        const doc = await fetchJson(`/api/documents/${documentId}`);
        if (!doc) return;

        /* Update topbar breadcrumb */
        document.getElementById("topbarDocTitle").textContent =
            (doc.title || "Untitled").toUpperCase();

        if (mode === "edit") {
            document.getElementById("editorSection").style.display = "block";
            document.getElementById("viewSection").style.display   = "none";
            document.getElementById("editModeBtn").style.display   = "none";

            document.getElementById("editDocTitle").textContent   = doc.title || "";
            document.getElementById("titleInput").value           = doc.title || "";
            document.getElementById("contentInput").value         = doc.content || "";
            document.getElementById("tagsInput").value            =
                (doc.tags || []).join(", ");
            document.getElementById("statusInput").value          =
                doc.status || "DRAFT";
            updatePreview();

        } else {
            document.getElementById("editorSection").style.display = "none";
            document.getElementById("viewSection").style.display   = "block";
            document.getElementById("editModeBtn").style.display   = "inline-flex";

            /* Tags + status row */
            const tagsRow = document.getElementById("viewTags");
            tagsRow.innerHTML = "";
            (doc.tags || []).forEach(tag => {
                const span = document.createElement("span");
                span.className = "doc-tag";
                span.textContent = tag;
                tagsRow.appendChild(span);
            });

            /* Status badge */
            const statusEl = document.getElementById("viewStatus");
            const s = (doc.status || "DRAFT").toUpperCase();
            statusEl.innerHTML = s === "PUBLISHED"
                ? `<span class="badge badge-published">Published</span>`
                : `<span class="badge badge-draft">Draft</span>`;

            document.getElementById("viewTitle").textContent =
                doc.title || "Untitled";
            document.getElementById("viewContent").innerHTML =
                renderMarkdown(doc.content || "");

            /* Author + updated */
            document.getElementById("viewAuthor").textContent =
                "Penned by " + (doc.createdByFullName || doc.createdByEmail || "Unknown");
            document.getElementById("viewUpdated").textContent =
                "Last updated " + timeAgo(doc.updatedAt);
        }

        await loadAttachments();
        await loadComments();
        await loadVersions();
    }

    /* ══════════════════════════════════════
       SAVE DOCUMENT
    ══════════════════════════════════════ */
    async function saveDocument() {
        const title   = document.getElementById("titleInput").value.trim();
        const content = document.getElementById("contentInput").value;
        const status  = document.getElementById("statusInput").value;
        const tags    = document.getElementById("tagsInput").value
            .split(",").map(t => t.trim()).filter(Boolean);

        clearError();
        try {
            await fetchJson(`/api/documents/${documentId}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, content, tags, status })
            });
            const msg = document.getElementById("saveMessage");
            msg.textContent = "Saved ✓";
            setTimeout(() => { msg.textContent = ""; }, 2000);
            await loadVersions();
        } catch (error) { showError(error.message); }
    }

    /* ══════════════════════════════════════
       EVENT LISTENERS
    ══════════════════════════════════════ */
    document.getElementById("addAttachmentBtn")
        ?.addEventListener("click", addAttachment);

    document.getElementById("addCommentBtn")
        ?.addEventListener("click", () => addCommentFrom("commentInput"));

    document.getElementById("addCommentBtnView")
        ?.addEventListener("click", () => addCommentFrom("commentInputView"));

    document.getElementById("saveButton")
        ?.addEventListener("click", saveDocument);

    document.getElementById("titleInput")
        ?.addEventListener("input", updatePreview);
    document.getElementById("contentInput")
        ?.addEventListener("input", updatePreview);
    document.getElementById("tagsInput")
        ?.addEventListener("input", updatePreview);
    document.getElementById("statusInput")
        ?.addEventListener("change", updatePreview);

    document.getElementById("backButton")
        ?.addEventListener("click", () => history.back());

    document.getElementById("logoutButton")
        ?.addEventListener("click", async () => {
            try { await fetch("/logout", { method: "POST", credentials: "include" }); }
            catch (e) {}
            window.location.href = "/login.html";
        });

    /* ── Boot ── */
    (async function init() {
        await loadMe();
        await loadSidebarTeams();
        loadDocument().catch(err => showError(err.message));
    })();
</script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document · KnowledgeForge</title>
  <meta name="description" content="Read and edit a KnowledgeForge document.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="main" class="page">

  <!-- Loading -->
  <div id="loading" aria-busy="true" aria-label="Loading document">
    <span class="skeleton" style="display: block; width: 60%; height: 32px"></span>
    <span class="skeleton skeleton--line" style="display: block; width: 35%; margin: var(--space-4) 0 var(--space-8)"></span>
    <span class="skeleton skeleton--line" style="display: block; margin-bottom: var(--space-3)"></span>
    <span class="skeleton skeleton--line" style="display: block; margin-bottom: var(--space-3)"></span>
    <span class="skeleton skeleton--line" style="display: block; width: 80%"></span>
  </div>

  <!-- Whole-page load error -->
  <div class="error-state" id="load-error" role="alert" hidden>
    <span id="load-error-icon"></span>
    <span class="error-state__msg" id="load-error-msg"></span>
    <button type="button" class="btn btn--secondary btn--sm" id="retry-btn">Try again</button>
    <a class="btn btn--secondary btn--sm" id="back-btn" href="/dashboard.html" hidden>Back to dashboard</a>
  </div>

  <!-- View: document | history rail. On phones: document, files, comments, history. -->
  <div id="view" class="layout-aside" hidden>
    <article>
      <header style="margin-bottom: var(--space-8)">
        <h1 class="title-xl" id="v-title"></h1>
        <div class="meta-line" id="v-meta" style="margin-top: var(--space-3)"></div>
        <div class="tag-list" id="v-tags" style="margin-top: var(--space-3)" hidden></div>
      </header>
      <section class="card no-print" id="v-summary" aria-labelledby="v-summary-title" aria-live="polite" hidden style="margin-bottom: var(--space-6)">
        <h2 class="title-sm" id="v-summary-title" style="margin-bottom: var(--space-3)">Summary</h2>
        <div id="v-summary-body"></div>
        <p class="hint" id="v-summary-note" style="margin-top: var(--space-3)"></p>
      </section>
      <div class="prose" id="v-body"></div>
      <div class="empty" id="v-empty" hidden>
        <span class="empty__icon" id="v-empty-icon"></span>
        <h2 class="title-sm">This page is empty</h2>
        <p class="empty__text" id="v-empty-text"></p>
        <a class="btn btn--secondary" id="v-empty-btn" hidden>Start writing</a>
      </div>
    </article>

    <div class="no-print">
      <section id="v-files-section" hidden aria-labelledby="v-files-title" style="margin-top: var(--space-10)">
        <h2 class="title-sm" id="v-files-title" style="margin-bottom: var(--space-3)">Files and links</h2>
        <div class="file-list" id="v-files"></div>
      </section>

      <section aria-labelledby="comments-title" style="margin-top: var(--space-10); padding-top: var(--space-6); border-top: 1px solid var(--color-hairline)">
        <h2 class="title-sm" id="comments-title">Comments <span class="count" id="comments-count" hidden></span></h2>
        <div id="comments" aria-live="polite">
          <div class="skeleton-row" style="padding-left: 0"><span class="skeleton skeleton--avatar"></span><span class="skeleton skeleton--line"></span></div>
        </div>
        <form class="composer" id="composer" novalidate>
          <span id="composer-avatar"></span>
          <div style="flex: 1; min-width: 0">
            <label class="sr-only" for="comment-text">Add a comment</label>
            <textarea class="textarea" id="comment-text" maxlength="2000" placeholder="Add a comment"></textarea>
            <div class="btn-row" style="margin-top: var(--space-2); justify-content: space-between">
              <span class="hint">Ctrl+Enter to send</span>
              <button type="submit" class="btn btn--secondary btn--sm" id="comment-send">Comment</button>
            </div>
          </div>
        </form>
      </section>
    </div>

    <aside class="layout-aside__side no-print" aria-labelledby="history-title">
      <h2 class="title-sm" id="history-title">History</h2>
      <div id="versions">
        <div class="skeleton-row" style="padding-left: 0"><span class="skeleton skeleton--line"></span></div>
        <div class="skeleton-row" style="padding-left: 0"><span class="skeleton skeleton--line"></span></div>
      </div>
    </aside>
  </div>

  <!-- Editor -->
  <form id="editor" novalidate hidden>
    <label class="sr-only" for="e-title">Title</label>
    <input class="editor-title" id="e-title" maxlength="200" autocomplete="off" placeholder="Untitled" aria-describedby="e-title-error">
    <p class="field__error" id="e-title-error" hidden style="margin-top: var(--space-1)"></p>

    <div class="editor-toolbar" style="margin-top: var(--space-4)">
      <label class="sr-only" for="e-status">Status</label>
      <select class="select select--sm" id="e-status" style="width: auto">
        <option value="DRAFT">Draft</option>
        <option value="PUBLISHED">Published</option>
      </select>
      <div class="tag-input" id="e-tags" style="flex: 1 1 200px">
        <label class="sr-only" for="e-tag-field">Add tag</label>
        <input class="tag-input__field" id="e-tag-field" maxlength="40" autocomplete="off" placeholder="Add tag, press Enter">
      </div>
      <span class="btn-row" style="margin-left: auto">
        <span class="unsaved" id="e-unsaved" hidden>Unsaved changes</span>
        <a class="btn btn--ghost btn--sm" id="e-done">Done</a>
        <button type="submit" class="btn btn--primary btn--sm" id="e-save" title="Save (Ctrl+S)">Save</button>
      </span>
    </div>

    <div class="tabs editor-panes" role="tablist" aria-label="Editor view">
      <button type="button" class="tab" role="tab" id="pane-write" aria-selected="true" aria-controls="e-content">Write</button>
      <button type="button" class="tab" role="tab" id="pane-preview" aria-selected="false" aria-controls="e-preview" tabindex="-1">Preview</button>
    </div>
    <div class="editor-split" id="e-split" data-pane="write">
      <label class="sr-only" for="e-content">Content (Markdown)</label>
      <textarea class="textarea textarea--code" id="e-content" placeholder="Write in Markdown: # Heading, **bold**, - lists, `code`"></textarea>
      <div class="editor-preview prose" id="e-preview" aria-label="Preview"></div>
    </div>

    <section aria-labelledby="e-files-title" style="margin-top: var(--space-8)">
      <div class="section__header">
        <div>
          <h2 class="title-sm" id="e-files-title">Files and links</h2>
          <p class="hint">PDF, images, Office files, txt, md or csv, up to 5 MB each. Saved right away, not with the document.</p>
        </div>
        <span class="btn-row">
          <button type="button" class="btn btn--secondary btn--sm" id="e-upload-btn">Upload file</button>
          <button type="button" class="btn btn--ghost btn--sm" id="e-link-btn">Add link</button>
        </span>
      </div>
      <input type="file" id="e-file" hidden aria-label="Choose a file to upload" accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.txt,.md,.csv,.docx,.xlsx,.pptx">
      <div class="file-list" id="e-files"></div>
    </section>
  </form>

  <!-- Add link -->
  <dialog class="modal" id="link-modal" aria-labelledby="link-modal-title">
    <form id="link-form" novalidate>
      <div class="modal__header">
        <h2 class="title-md" id="link-modal-title">Add a link</h2>
        <button type="button" class="btn btn--ghost btn--icon btn--sm" data-close aria-label="Close" id="link-modal-x"></button>
      </div>
      <div class="modal__body">
        <div class="field">
          <label class="label" for="link-url">URL</label>
          <input class="input" id="link-url" type="url" maxlength="2000" autocomplete="off" placeholder="https://" aria-describedby="link-url-error">
          <p class="field__error" id="link-url-error" hidden></p>
        </div>
        <div class="field">
          <label class="label" for="link-name">Name</label>
          <input class="input" id="link-name" maxlength="200" autocomplete="off" placeholder="e.g. Spring Boot reference" aria-describedby="link-name-error">
          <p class="field__error" id="link-name-error" hidden></p>
        </div>
      </div>
      <div class="modal__footer">
        <button type="button" class="btn btn--secondary" data-close>Cancel</button>
        <button type="submit" class="btn btn--primary" id="link-submit">Add link</button>
      </div>
    </form>
  </dialog>

  <!-- Version preview -->
  <dialog class="modal modal--wide" id="ver-modal" aria-labelledby="ver-modal-title">
    <div class="modal__header">
      <div style="min-width: 0">
        <h2 class="title-md" id="ver-modal-title"></h2>
        <p class="caption" id="ver-modal-meta"></p>
      </div>
      <button type="button" class="btn btn--ghost btn--icon btn--sm" data-close aria-label="Close" id="ver-modal-x"></button>
    </div>
    <div class="modal__body">
      <h3 class="title-lg" id="ver-modal-doc-title" style="margin-bottom: var(--space-4)"></h3>
      <div class="prose" id="ver-modal-body"></div>
    </div>
    <div class="modal__footer">
      <button type="button" class="btn btn--secondary" data-close>Close</button>
      <button type="button" class="btn btn--primary" id="ver-restore" hidden>Restore this version</button>
    </div>
  </dialog>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="/app.js"></script>
<script>
  (function () {
    const esc = KF.escapeHtml;
    const $ = function (id) { return document.getElementById(id); };
    const params = new URLSearchParams(location.search);
    const docId = params.get("id");
    const docUrl = "/api/documents/" + encodeURIComponent(docId || "");
    const wantsEdit = params.get("mode") === "edit";

    $("load-error-icon").outerHTML = KF.icon("alert-circle");
    $("v-empty-icon").innerHTML = KF.icon("file-text");
    ["link-modal-x", "ver-modal-x"].forEach(function (id) { $(id).innerHTML = KF.icon("x"); });
    $("e-upload-btn").innerHTML = KF.icon("upload") + "Upload file";
    $("e-link-btn").innerHTML = KF.icon("link") + "Add link";

    let doc = null;
    let space = null;
    let me = null;
    let members = {};      // userId -> { fullName, email }
    let editable = false;

    /* Inline error with a retry button, for one section of the page */
    function sectionError(box, msg, retry) {
      box.innerHTML = '<div class="error-state" role="alert">' + KF.icon("alert-circle") + '<span class="error-state__msg">' + esc(msg) +
        '</span><button type="button" class="btn btn--secondary btn--sm">Try again</button></div>';
      const btn = box.querySelector("button");
      btn.addEventListener("click", function () { KF.withLoading(btn, retry); });
    }

    /* ---------- Comments ---------- */
    let comments = [];

    function renderComments() {
      const box = $("comments");
      $("comments-count").textContent = comments.length;
      $("comments-count").hidden = !comments.length;
      if (!comments.length) {
        box.innerHTML = '<p class="text-steel" style="padding: var(--space-3) 0">No comments yet. Questions and suggestions go here.</p>';
        return;
      }
      box.innerHTML = comments.map(function (c) {
        const who = c.createdByFullName || c.createdByEmail || "Unknown user";
        const when = c.createdAt ? new Date(c.createdAt) : null;
        // The API only lets you delete your own comments
        const mine = me && c.createdByUserId === me.id;
        return '<div class="comment">' + KF.avatar({ fullName: c.createdByFullName, email: c.createdByEmail }) +
          '<div class="comment__body"><div class="comment__head"><span class="comment__author">' + esc(who) + "</span>" +
          (when ? '<time class="comment__time" datetime="' + esc(when.toISOString()) + '" title="' + esc(KF.formatDate(when) + ", " + KF.formatTime(when)) + '">' + esc(KF.relativeTime(when)) + "</time>" : "") +
          (mine ? '<button type="button" class="btn btn--ghost btn--icon btn--sm comment__delete" data-delete-comment="' + esc(c.id) + '" aria-label="Delete comment" data-tooltip="Delete">' + KF.icon("trash") + "</button>" : "") +
          '</div><p class="comment__text">' + esc(c.content) + "</p></div></div>";
      }).join("");
    }

    async function loadComments() {
      try {
        const data = await KF.api(docUrl + "/comments");
        comments = (Array.isArray(data) ? data : []).sort(function (a, b) { return new Date(a.createdAt || 0) - new Date(b.createdAt || 0); });
        renderComments();
      } catch (err) {
        sectionError($("comments"), "Couldn't load comments. " + err.message, loadComments);
      }
    }

    function bindComments() {
      $("composer-avatar").outerHTML = KF.avatar(me);
      const text = $("comment-text");
      $("composer").addEventListener("submit", function (e) {
        e.preventDefault();
        const content = text.value.trim();
        if (!content) { text.focus(); return; }
        KF.withLoading($("comment-send"), async function () {
          try {
            await KF.api(docUrl + "/comments", { json: { content: content } });
            text.value = "";
            await loadComments();
          } catch (err) {
            KF.toast("Couldn't post your comment. " + err.message, { type: "error" });
          }
        });
      });
      text.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $("composer").requestSubmit(); }
      });
      $("comments").addEventListener("click", async function (e) {
        const btn = e.target.closest("[data-delete-comment]");
        if (!btn) return;
        const ok = await KF.confirmDialog({ title: "Delete your comment?", message: "This can't be undone.", confirmLabel: "Delete comment" });
        if (!ok) return;
        try {
          await KF.api("/api/comments/" + encodeURIComponent(btn.dataset.deleteComment), { method: "DELETE" });
          KF.toast("Comment deleted.");
          await loadComments();
        } catch (err) {
          KF.toast("Couldn't delete the comment. " + err.message, { type: "error" });
        }
      });
    }

    /* ---------- Versions ---------- */
    let versions = [];
    let openVersion = null;

    function versionWho(v) { return v.savedByFullName || v.savedByEmail || "Unknown user"; }
    function versionWhen(v) {
      if (!v.savedAt) return "";
      const d = new Date(v.savedAt);
      return KF.relativeTime(d) === KF.formatDate(d) ? KF.formatDate(d) : KF.relativeTime(d) + ", " + KF.formatTime(d);
    }

    /* "+3 −1 lines": lines added / removed between two texts, ignoring order (a cheap stand-in for a real diff) */
    function lineChange(before, after) {
      const count = {};
      String(before || "").split("\n").forEach(function (l) { count[l] = (count[l] || 0) + 1; });
      let added = 0;
      String(after || "").split("\n").forEach(function (l) { if (count[l]) count[l]--; else added++; });
      const removed = Object.keys(count).reduce(function (n, k) { return n + count[k]; }, 0);
      return added || removed ? "+" + added + " −" + removed + " lines" : "";
    }
    console.assert(lineChange("a\nb", "a\nc\nd") === "+2 −1 lines" && lineChange("a", "a") === "", "lineChange");

    function renderVersions() {
      const box = $("versions");
      if (!versions.length) {
        box.innerHTML = '<p class="caption" style="padding: var(--space-3) 0">No earlier versions. Each save from the editor adds one here.</p>';
        return;
      }
      box.innerHTML = '<ol class="versions">' + versions.map(function (v, i) {
        const current = i === 0; // newest snapshot = what the document holds now
        const older = versions[i + 1];
        const what = !older ? "First version"
          : [older.title !== v.title ? "Renamed" : "", lineChange(older.content, v.content)].filter(Boolean).join(", ") || "No text changes";
        return '<li class="version' + (current ? " is-current" : "") + '">' +
          '<span class="version__num">v' + esc(v.versionNumber) + "</span>" +
          '<span class="version__info"><span class="truncate" style="display: block; color: var(--color-ink)">' + esc(what) + "</span>" +
          '<span class="truncate" style="display: block">' + esc(versionWho(v) + " · " + versionWhen(v)) + "</span></span>" +
          (current ? '<span class="badge">Current</span>' : "") +
          '<button type="button" class="btn btn--ghost btn--icon btn--sm" data-version="' + i + '" aria-label="View version ' + esc(v.versionNumber) + '" data-tooltip="View">' + KF.icon("eye") + "</button></li>";
      }).join("") + "</ol>";
    }

    async function loadVersions() {
      try {
        const data = await KF.api(docUrl + "/versions");
        versions = (Array.isArray(data) ? data : []).sort(function (a, b) { return (b.versionNumber || 0) - (a.versionNumber || 0); });
        renderVersions();
      } catch (err) {
        sectionError($("versions"), "Couldn't load the history. " + err.message, loadVersions);
      }
    }

    function bindVersions() {
      const modal = $("ver-modal");
      $("versions").addEventListener("click", function (e) {
        const btn = e.target.closest("[data-version]");
        if (!btn) return;
        const i = Number(btn.dataset.version);
        openVersion = versions[i];
        $("ver-modal-title").textContent = "Version " + openVersion.versionNumber + (i === 0 ? " (current)" : "");
        $("ver-modal-meta").textContent = "Saved by " + versionWho(openVersion) + (openVersion.savedAt ? " · " + versionWhen(openVersion) : "");
        $("ver-modal-doc-title").textContent = openVersion.title || "Untitled";
        $("ver-modal-body").innerHTML = String(openVersion.content || "").trim() ? renderMarkdown(openVersion.content) : '<p class="text-steel">This version was empty.</p>';
        $("ver-restore").hidden = !editable || i === 0;
        KF.openModal(modal);
      });
      $("ver-restore").addEventListener("click", function () {
        const v = openVersion;
        KF.withLoading($("ver-restore"), async function () {
          try {
            await KF.api(docUrl + "/versions/" + encodeURIComponent(v.id) + "/restore", { method: "POST" });
            modal.close();
            doc = (await KF.api(docUrl)) || doc;
            renderView();
            setCrumbs();
            await loadVersions();
            KF.toast("Restored version " + v.versionNumber + ".");
          } catch (err) {
            KF.toast("Couldn't restore that version. " + err.message, { type: "error" });
          }
        });
      });
    }

    /* ---------- Files and links ---------- */
    let files = [];
    const MAX_UPLOAD = 5 * 1024 * 1024; // keep in sync with the server limit
    const ALLOWED = /\.(pdf|png|jpe?g|gif|webp|txt|md|csv|docx|xlsx|pptx)$/i;

    /* Only http(s) links are clickable; blocks javascript: and data: URLs */
    function safeUrl(url) { return /^https?:\/\//i.test(url || "") ? url : null; }
    function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return ""; } }

    function chipHtml(a, removable) {
      const href = a.fileId ? "/api/attachments/" + encodeURIComponent(a.id) + "/download" : safeUrl(a.url);
      const name = a.originalName || a.url || "Untitled";
      const iconName = !a.fileId ? "link" : String(a.contentType || "").indexOf("image/") === 0 ? "image" : "file";
      const host = hostOf(a.url);
      const extra = a.fileId ? KF.formatSize(a.size) : host !== name ? host : "";
      const inner = KF.icon(iconName, "file-chip__icon") + '<span class="file-chip__name">' + esc(name) + "</span>" +
        (extra ? '<span class="file-chip__size">' + esc(extra) + "</span>" : "");
      const tip = a.fileId ? "Download " + name : name + " (" + (a.url || "") + ")";
      const link = href
        ? '<a class="' + (removable ? "file-chip__link" : "file-chip") + '" href="' + esc(href) + '" title="' + esc(tip) + '"' +
          (a.fileId ? "" : ' target="_blank" rel="noopener noreferrer"') + ">" + inner + "</a>"
        : '<span class="' + (removable ? "file-chip__link" : "file-chip") + '" title="' + esc(tip) + '">' + inner + "</span>";
      if (!removable) return link;
      return '<span class="file-chip">' + link + '<button type="button" class="file-chip__remove" data-delete-file="' + esc(a.id) +
        '" aria-label="Delete ' + esc(name) + '">' + KF.icon("x", "icon--sm") + "</button></span>";
    }

    function renderFiles() {
      $("v-files").innerHTML = files.map(function (a) { return chipHtml(a, false); }).join("");
      $("v-files-section").hidden = !files.length;
      $("e-files").innerHTML = files.length
        ? files.map(function (a) { return chipHtml(a, true); }).join("")
        : '<p class="caption">No files or links yet.</p>';
    }

    async function loadFiles() {
      try {
        const data = await KF.api(docUrl + "/attachments");
        files = Array.isArray(data) ? data : [];
        renderFiles();
      } catch (err) {
        $("v-files-section").hidden = false;
        sectionError($("v-files"), "Couldn't load files. " + err.message, loadFiles);
        sectionError($("e-files"), "Couldn't load files. " + err.message, loadFiles);
      }
    }

    function linkError(field, msg) {
      $(field).setAttribute("aria-invalid", msg ? "true" : "false");
      $(field + "-error").hidden = !msg;
      $(field + "-error").innerHTML = msg ? KF.icon("alert-circle", "icon--sm") + esc(msg) : "";
    }

    function bindFiles() {
      const input = $("e-file");
      $("e-upload-btn").addEventListener("click", function () { input.click(); });
      input.addEventListener("change", function () {
        const file = input.files && input.files[0];
        input.value = "";
        if (!file) return;
        // Checked here too so a bad file fails at once instead of after the upload
        if (!ALLOWED.test(file.name)) { KF.toast("That file type isn't allowed. Use PDF, images, Office files, txt, md or csv.", { type: "error" }); return; }
        if (file.size > MAX_UPLOAD) { KF.toast("“" + file.name + "” is " + KF.formatSize(file.size) + ". The limit is 5 MB.", { type: "error" }); return; }
        const form = new FormData();
        form.append("file", file);
        KF.withLoading($("e-upload-btn"), async function () {
          try {
            await KF.api(docUrl + "/attachments/upload", { method: "POST", body: form });
            KF.toast("Uploaded “" + file.name + "”.");
            await loadFiles();
          } catch (err) {
            KF.toast("Couldn't upload “" + file.name + "”. " + err.message, { type: "error" });
          }
        });
      });

      const modal = $("link-modal");
      $("e-link-btn").addEventListener("click", function () {
        $("link-form").reset();
        linkError("link-url", ""); linkError("link-name", "");
        KF.openModal(modal);
        $("link-url").focus();
      });
      $("link-form").addEventListener("submit", function (e) {
        e.preventDefault();
        const url = $("link-url").value.trim();
        const name = $("link-name").value.trim() || hostOf(url);
        linkError("link-url", !url ? "Paste the link." : !safeUrl(url) ? "Links must start with http:// or https://" : "");
        linkError("link-name", url && safeUrl(url) && !name ? "Give the link a name." : "");
        if (!url || !safeUrl(url) || !name) return;
        KF.withLoading($("link-submit"), async function () {
          try {
            await KF.api(docUrl + "/attachments", { json: { originalName: name, url: url } });
            modal.close();
            KF.toast("Added “" + name + "”.");
            await loadFiles();
          } catch (err) {
            linkError("link-url", "Couldn't add the link. " + err.message);
          }
        });
      });

      $("e-files").addEventListener("click", async function (e) {
        const btn = e.target.closest("[data-delete-file]");
        if (!btn) return;
        const a = files.find(function (x) { return x.id === btn.dataset.deleteFile; }) || {};
        const name = a.originalName || "this item";
        const ok = await KF.confirmDialog({
          title: "Delete “" + name + "”?",
          message: a.fileId ? "The file is removed for everyone. This can't be undone." : "The link is removed from this document.",
          confirmLabel: a.fileId ? "Delete file" : "Delete link"
        });
        if (!ok) return;
        try {
          await KF.api("/api/attachments/" + encodeURIComponent(a.id), { method: "DELETE" });
          KF.toast("Deleted “" + name + "”.");
          await loadFiles();
        } catch (err) {
          KF.toast("Couldn't delete “" + name + "”. " + err.message, { type: "error" });
        }
      });
    }

    /* ---------- Export ---------- */
    function exportMarkdown() {
      const title = doc.title || "Untitled";
      const md = "# " + title + "\n\n" + (doc.content || "") + "\n";
      // Strip characters Windows/macOS don't allow in file names
      const fileName = (title.replace(/[\\/:*?"<>|]+/g, "").trim() || "document") + ".md";
      const url = URL.createObjectURL(new Blob([md], { type: "text/markdown;charset=utf-8" }));
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    /* ---------- AI summary ---------- */
    function summarizeUi(btn) {
      const card = $("v-summary"), body = $("v-summary-body"), note = $("v-summary-note");
      const privacy = "Sends document text to an AI provider (Groq).";
      btn.title = privacy;
      btn.addEventListener("click", function () {
        KF.withLoading(btn, async function () {
          card.hidden = false;
          note.textContent = privacy;
          body.innerHTML = '<span class="skeleton skeleton--line" style="display: block; margin-bottom: var(--space-3)"></span>' +
            '<span class="skeleton skeleton--line" style="display: block; margin-bottom: var(--space-3)"></span>' +
            '<span class="skeleton skeleton--line" style="display: block; width: 70%"></span>';
          try {
            const r = await KF.api(docUrl + "/ai/summary", { method: "POST" });
            body.innerHTML = '<div class="prose">' + renderMarkdown(r.summary) + "</div>";
            note.textContent = (r.cached ? "Saved summary. " : "Generated just now. ") +
              (r.trimmed ? "Based on the first part of a long document. " : "") + privacy;
          } catch (err) {
            if (err.status === 503 && /not configured/i.test(err.message)) { // no key on this server: hide AI for this visit
              card.hidden = true;
              btn.hidden = true;
              return;
            }
            body.innerHTML = '<div class="error-state" role="alert">' + KF.icon("alert-circle") + '<span class="error-state__msg">' + esc(err.message) + "</span></div>";
          }
        });
      });
    }

    function viewActions() {
      const hasText = !!String(doc.content || "").trim();
      $("kf-actions").innerHTML =
        (hasText ? '<button type="button" class="btn btn--secondary btn--sm" id="summarize-btn" aria-label="Summarize">' + KF.icon("sparkles") + '<span class="btn__label">Summarize</span></button>' : "") +
        '<div class="dropdown">' +
          '<button type="button" class="btn btn--secondary btn--sm" aria-haspopup="menu" aria-expanded="false" aria-label="Export">' + KF.icon("download") + '<span class="btn__label">Export</span></button>' +
          '<div class="menu" role="menu" hidden>' +
            '<button type="button" class="menu__item" role="menuitem" data-export="md">' + KF.icon("file-text") + "Markdown (.md)</button>" +
            '<button type="button" class="menu__item" role="menuitem" data-export="pdf">' + KF.icon("file") + "PDF (print)</button>" +
          "</div>" +
        "</div>" +
        (editable ? '<a class="btn btn--primary btn--sm" href="' + esc(pageHref("edit")) + '" aria-label="Edit">' + KF.icon("pencil") + '<span class="btn__label">Edit</span></a>' : "");
      if (hasText) summarizeUi($("summarize-btn"));
      $("kf-actions").addEventListener("click", function (e) {
        const item = e.target.closest("[data-export]");
        if (!item) return;
        const trigger = item.closest(".dropdown").querySelector("[aria-haspopup]");
        trigger.setAttribute("aria-expanded", "false");
        item.closest(".menu").hidden = true;
        trigger.focus();
        if (item.dataset.export === "md") exportMarkdown();
        else window.print(); // pick "Save as PDF"; print CSS hides everything but the document
      });
    }

    function pageHref(mode) { return "/document.html?id=" + encodeURIComponent(docId) + "&mode=" + mode; }

    /* Markdown -> sanitised HTML. Without the sanitiser, show the source as plain text, never raw HTML. */
    function renderMarkdown(md) {
      if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(md || "", { breaks: true, gfm: true }));
      return "<p style=\"white-space: pre-wrap\">" + esc(md || "") + "</p>";
    }

    function personName(userId) {
      const m = members[userId];
      return m ? (m.fullName || m.email) : null;
    }

    /* ---------- View ---------- */
    function renderView() {
      const title = doc.title || "Untitled";
      $("v-title").textContent = title;

      const author = personName(doc.createdBy);
      const updater = personName(doc.updatedBy);
      const parts = [];
      if (author) parts.push('<span style="display: inline-flex; align-items: center; gap: 6px">' + KF.avatar(members[doc.createdBy], "sm") + esc(author) + "</span>");
      if (doc.updatedAt) {
        const when = new Date(doc.updatedAt);
        parts.push('<span>Updated <time datetime="' + esc(when.toISOString()) + '" title="' + esc(KF.formatDate(when) + ", " + KF.formatTime(when)) + '">' +
          esc(KF.relativeTime(when)) + "</time>" + (updater && updater !== author ? " by " + esc(updater) : "") + "</span>");
      }
      // Published is the normal state; only drafts get a badge (same as the space page)
      if (String(doc.status).toUpperCase() !== "PUBLISHED") parts.push('<span class="badge badge--draft">Draft</span>');
      $("v-meta").innerHTML = parts.join('<span class="meta-line__sep" aria-hidden="true"></span>');

      const tags = Array.isArray(doc.tags) ? doc.tags : [];
      $("v-tags").innerHTML = tags.map(function (t) { return KF.tag(t, "/search.html?tag=" + encodeURIComponent(t)); }).join("");
      $("v-tags").hidden = !tags.length;

      const empty = !String(doc.content || "").trim();
      $("v-body").innerHTML = empty ? "" : renderMarkdown(doc.content);
      $("v-body").hidden = empty;
      $("v-empty").hidden = !empty;
      $("v-empty-text").textContent = editable ? "Nothing has been written here yet." : "Nothing has been written here yet. An admin or editor can add the content.";
      $("v-empty-btn").hidden = !editable;
      $("v-empty-btn").href = pageHref("edit");
      $("v-empty-btn").innerHTML = KF.icon("pencil") + "Start writing";
    }

    /* ---------- Editor ---------- */
    let tags = [];
    let saved = "";   // snapshot of the last saved state, to spot unsaved changes

    function snapshot() {
      return JSON.stringify([$("e-title").value.trim(), $("e-content").value, $("e-status").value, tags]);
    }
    function isDirty() { return snapshot() !== saved || $("e-tag-field").value.trim() !== ""; }
    function updateDirty() { $("e-unsaved").hidden = !isDirty(); }

    function renderTags() {
      const box = $("e-tags");
      box.querySelectorAll(".tag").forEach(function (el) { el.remove(); });
      box.insertAdjacentHTML("afterbegin", tags.map(function (t, i) {
        return '<span class="tag tint-' + KF.tintFor(t) + '">' + esc(t) +
          '<button type="button" class="tag__remove" data-remove-tag="' + i + '" aria-label="Remove tag ' + esc(t) + '">' + KF.icon("x") + "</button></span>";
      }).join(""));
    }

    function addTag(raw) {
      String(raw).split(",").map(function (t) { return t.trim(); }).filter(Boolean).forEach(function (t) {
        if (!tags.some(function (x) { return x.toLowerCase() === t.toLowerCase(); })) tags.push(t);
      });
      renderTags();
    }

    function updatePreview() {
      const md = $("e-content").value;
      $("e-preview").innerHTML = md.trim() ? renderMarkdown(md) : '<p class="text-steel">The preview shows up here as you write.</p>';
      // Grow the textarea with its text so the page is the only scrollbar
      const ta = $("e-content");
      ta.style.height = "auto";
      ta.style.height = ta.scrollHeight + 2 + "px";
    }

    function fillEditor() {
      $("e-title").value = doc.title || "";
      $("e-content").value = doc.content || "";
      $("e-status").value = String(doc.status).toUpperCase() === "PUBLISHED" ? "PUBLISHED" : "DRAFT";
      tags = Array.isArray(doc.tags) ? doc.tags.slice() : [];
      renderTags();
      updatePreview();
      saved = snapshot();
      updateDirty();
    }

    function titleError(msg) {
      $("e-title").setAttribute("aria-invalid", msg ? "true" : "false");
      $("e-title-error").hidden = !msg;
      $("e-title-error").innerHTML = msg ? KF.icon("alert-circle", "icon--sm") + esc(msg) : "";
    }

    async function save() {
      if ($("e-save").disabled) return;
      if ($("e-tag-field").value.trim()) { addTag($("e-tag-field").value); $("e-tag-field").value = ""; }
      const title = $("e-title").value.trim();
      titleError(title ? "" : "Give the document a title.");
      if (!title) { $("e-title").focus(); return; }
      await KF.withLoading($("e-save"), async function () {
        try {
          const body = { title: title, content: $("e-content").value, tags: tags, status: $("e-status").value };
          const updated = await KF.api(docUrl, { method: "PUT", json: body });
          doc = Object.assign(doc, updated || body);
          saved = snapshot();
          updateDirty();
          setCrumbs();
          KF.toast("Saved.");
        } catch (err) {
          KF.toast("Couldn't save. " + err.message, { type: "error" });
        }
      });
    }

    function bindEditor() {
      $("editor").addEventListener("submit", function (e) { e.preventDefault(); save(); });
      $("editor").addEventListener("input", updateDirty);
      $("editor").addEventListener("change", updateDirty);
      $("e-content").addEventListener("input", updatePreview);
      $("e-title").addEventListener("input", function () { if ($("e-title").value.trim()) titleError(""); });
      // Enter in the title jumps to the body instead of submitting
      $("e-title").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); $("e-content").focus({ preventScroll: true }); } });

      const field = $("e-tag-field");
      field.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === ",") {
          e.preventDefault();
          if (field.value.trim()) { addTag(field.value); field.value = ""; updateDirty(); }
        } else if (e.key === "Backspace" && !field.value && tags.length) {
          tags.pop(); renderTags(); updateDirty();
        }
      });
      field.addEventListener("blur", function () { if (field.value.trim()) { addTag(field.value); field.value = ""; updateDirty(); } });
      $("e-tags").addEventListener("click", function (e) {
        const btn = e.target.closest("[data-remove-tag]");
        if (btn) { tags.splice(Number(btn.dataset.removeTag), 1); renderTags(); updateDirty(); field.focus(); return; }
        if (e.target === $("e-tags")) field.focus();
      });

      document.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) { e.preventDefault(); save(); }
      });
      window.addEventListener("beforeunload", function (e) { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });

      // Write / Preview switch (phones and tablets)
      const panes = [$("pane-write"), $("pane-preview")];
      panes.forEach(function (tab, i) {
        tab.addEventListener("click", function () { showPane(i); });
        tab.addEventListener("keydown", function (e) {
          if (e.key === "ArrowRight" || e.key === "ArrowLeft") { showPane(1 - i); panes[1 - i].focus(); }
        });
      });
      function showPane(i) {
        $("e-split").dataset.pane = i ? "preview" : "write";
        updatePreview(); // re-measures the textarea, which was 0px tall while hidden
        panes.forEach(function (t, j) { t.setAttribute("aria-selected", String(i === j)); t.tabIndex = i === j ? 0 : -1; });
      }
      $("e-done").href = pageHref("view");
    }

    /* ---------- Load ---------- */
    function setCrumbs() {
      const title = (doc && doc.title) || "Untitled";
      document.title = title + " · KnowledgeForge";
      const team = space && KF.teams().find(function (t) { return t.teamId === space.teamId; });
      const crumbs = [];
      if (team) crumbs.push({ label: team.teamName || "Team", href: "/team.html?id=" + encodeURIComponent(team.teamId) });
      if (space) crumbs.push({ label: space.name || "Space", href: "/space.html?id=" + encodeURIComponent(doc.spaceId) });
      crumbs.push({ label: title });
      KF.setBreadcrumbs(crumbs);
    }

    function showLoadError(err) {
      $("loading").hidden = true;
      $("view").hidden = true;
      $("editor").hidden = true;
      const known = err.status === 403 || err.status === 404 || !docId;
      $("load-error-msg").textContent = !docId ? "No document was picked. Open one from its space."
        : err.status === 403 ? "You're not a member of this document's team. Ask a team admin for an invite link."
        : err.status === 404 ? "This document doesn't exist. It may have been deleted."
        : "Couldn't load this document. " + err.message;
      $("retry-btn").hidden = known;
      $("back-btn").hidden = !known;
      $("load-error").hidden = false;
    }

    async function load() {
      $("load-error").hidden = true;
      try {
        doc = (await KF.api(docUrl)) || {};
        // Space + team only add names and permissions; the document still shows if they fail
        space = await KF.api("/api/spaces/" + encodeURIComponent(doc.spaceId)).catch(function () { return null; });
        if (space) {
          const team = await KF.api("/api/teams/" + encodeURIComponent(space.teamId)).catch(function () { return null; });
          members = {};
          ((team && team.teamMembers) || []).forEach(function (m) { members[m.userId] = m; });
          const link = document.querySelector('#kf-sidebar a[href="/team.html?id=' + encodeURIComponent(space.teamId) + '"]');
          if (link) { link.classList.add("is-active"); link.setAttribute("aria-current", "page"); }
        }
        editable = !!space && KF.canEdit(space.teamId);
        setCrumbs();
        $("loading").hidden = true;

        if (wantsEdit && editable) {
          bindEditor();
          bindFiles();
          fillEditor();
          $("editor").hidden = false;
          updatePreview(); // measure the textarea now that it's visible
          $("e-content").focus({ preventScroll: true });
          loadFiles();
        } else {
          if (wantsEdit) history.replaceState(null, "", pageHref("view")); // viewers never get the editor
          renderView();
          viewActions();
          bindComments();
          bindVersions();
          $("view").hidden = false;
          loadFiles();
          loadComments();
          loadVersions();
        }
      } catch (err) {
        showLoadError(err);
      }
    }

    let shellReady = false;
    $("retry-btn").addEventListener("click", function () {
      if (!shellReady) { location.reload(); return; }
      KF.withLoading($("retry-btn"), load);
    });

    KF.initShell({ active: null, breadcrumbs: [{ label: "Document" }] }).then(function (shell) {
      shellReady = true;
      me = shell.me;
      if (!docId) { showLoadError({}); return; }
      return load();
    }, showLoadError);
  })();
</script>
</body>
</html>

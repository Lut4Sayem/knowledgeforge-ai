<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Document · KnowledgeForge</title>
  <meta name="description" content="Read and edit a KnowledgeForge document.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="main" class="page page--reading">

  <!-- Loading -->
  <div id="loading" aria-busy="true" aria-label="Loading document">
    <span class="skeleton" style="display: block; width: 60%; height: 32px"></span>
    <span class="skeleton skeleton--line" style="display: block; width: 35%; margin: var(--space-4) 0 var(--space-8)"></span>
    <span class="skeleton skeleton--line" style="display: block; margin-bottom: var(--space-3)"></span>
    <span class="skeleton skeleton--line" style="display: block; margin-bottom: var(--space-3)"></span>
    <span class="skeleton skeleton--line" style="display: block; width: 80%"></span>
  </div>

  <!-- Whole-page load error -->
  <div class="error-state" id="load-error" role="alert" hidden>
    <span id="load-error-icon"></span>
    <span class="error-state__msg" id="load-error-msg"></span>
    <button type="button" class="btn btn--secondary btn--sm" id="retry-btn">Try again</button>
    <a class="btn btn--secondary btn--sm" id="back-btn" href="/dashboard.html" hidden>Back to dashboard</a>
  </div>

  <!-- View -->
  <article id="view" hidden>
    <header style="margin-bottom: var(--space-8)">
      <h1 class="title-xl" id="v-title"></h1>
      <div class="meta-line" id="v-meta" style="margin-top: var(--space-3)"></div>
      <div class="tag-list" id="v-tags" style="margin-top: var(--space-3)" hidden></div>
    </header>
    <div class="prose" id="v-body"></div>
    <div class="empty" id="v-empty" hidden>
      <span class="empty__icon" id="v-empty-icon"></span>
      <h2 class="title-sm">This page is empty</h2>
      <p class="empty__text" id="v-empty-text"></p>
      <a class="btn btn--secondary" id="v-empty-btn" hidden>Start writing</a>
    </div>
  </article>

  <!-- Editor -->
  <form id="editor" novalidate hidden>
    <label class="sr-only" for="e-title">Title</label>
    <input class="editor-title" id="e-title" maxlength="200" autocomplete="off" placeholder="Untitled" aria-describedby="e-title-error">
    <p class="field__error" id="e-title-error" hidden style="margin-top: var(--space-1)"></p>

    <div class="editor-toolbar" style="margin-top: var(--space-4)">
      <label class="sr-only" for="e-status">Status</label>
      <select class="select select--sm" id="e-status" style="width: auto">
        <option value="DRAFT">Draft</option>
        <option value="PUBLISHED">Published</option>
      </select>
      <div class="tag-input" id="e-tags" style="flex: 1 1 200px">
        <label class="sr-only" for="e-tag-field">Add tag</label>
        <input class="tag-input__field" id="e-tag-field" maxlength="40" autocomplete="off" placeholder="Add tag, press Enter">
      </div>
      <span class="btn-row" style="margin-left: auto">
        <span class="unsaved" id="e-unsaved" hidden>Unsaved changes</span>
        <a class="btn btn--ghost btn--sm" id="e-done">Done</a>
        <button type="submit" class="btn btn--primary btn--sm" id="e-save" title="Save (Ctrl+S)">Save</button>
      </span>
    </div>

    <div class="tabs editor-panes" role="tablist" aria-label="Editor view">
      <button type="button" class="tab" role="tab" id="pane-write" aria-selected="true" aria-controls="e-content">Write</button>
      <button type="button" class="tab" role="tab" id="pane-preview" aria-selected="false" aria-controls="e-preview" tabindex="-1">Preview</button>
    </div>
    <div class="editor-split" id="e-split" data-pane="write">
      <label class="sr-only" for="e-content">Content (Markdown)</label>
      <textarea class="textarea textarea--code" id="e-content" placeholder="Write in Markdown: # Heading, **bold**, - lists, `code`"></textarea>
      <div class="editor-preview prose" id="e-preview" aria-label="Preview"></div>
    </div>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="/app.js"></script>
<script>
  (function () {
    const esc = KF.escapeHtml;
    const $ = function (id) { return document.getElementById(id); };
    const params = new URLSearchParams(location.search);
    const docId = params.get("id");
    const docUrl = "/api/documents/" + encodeURIComponent(docId || "");
    const wantsEdit = params.get("mode") === "edit";

    $("load-error-icon").outerHTML = KF.icon("alert-circle");
    $("v-empty-icon").innerHTML = KF.icon("file-text");

    let doc = null;
    let space = null;
    let members = {};      // userId -> { fullName, email }
    let editable = false;

    function pageHref(mode) { return "/document.html?id=" + encodeURIComponent(docId) + "&mode=" + mode; }

    /* Markdown -> sanitised HTML. Without the sanitiser, show the source as plain text, never raw HTML. */
    function renderMarkdown(md) {
      if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(md || "", { breaks: true, gfm: true }));
      return "<p style=\"white-space: pre-wrap\">" + esc(md || "") + "</p>";
    }

    function personName(userId) {
      const m = members[userId];
      return m ? (m.fullName || m.email) : null;
    }

    /* ---------- View ---------- */
    function renderView() {
      const title = doc.title || "Untitled";
      $("v-title").textContent = title;

      const author = personName(doc.createdBy);
      const updater = personName(doc.updatedBy);
      const parts = [];
      if (author) parts.push('<span style="display: inline-flex; align-items: center; gap: 6px">' + KF.avatar(members[doc.createdBy], "sm") + esc(author) + "</span>");
      if (doc.updatedAt) {
        const when = new Date(doc.updatedAt);
        parts.push('<span>Updated <time datetime="' + esc(when.toISOString()) + '" title="' + esc(KF.formatDate(when) + ", " + KF.formatTime(when)) + '">' +
          esc(KF.relativeTime(when)) + "</time>" + (updater && updater !== author ? " by " + esc(updater) : "") + "</span>");
      }
      // Published is the normal state; only drafts get a badge (same as the space page)
      if (String(doc.status).toUpperCase() !== "PUBLISHED") parts.push('<span class="badge badge--draft">Draft</span>');
      $("v-meta").innerHTML = parts.join('<span class="meta-line__sep" aria-hidden="true"></span>');

      const tags = Array.isArray(doc.tags) ? doc.tags : [];
      $("v-tags").innerHTML = tags.map(function (t) { return KF.tag(t, "/search.html?tag=" + encodeURIComponent(t)); }).join("");
      $("v-tags").hidden = !tags.length;

      const empty = !String(doc.content || "").trim();
      $("v-body").innerHTML = empty ? "" : renderMarkdown(doc.content);
      $("v-body").hidden = empty;
      $("v-empty").hidden = !empty;
      $("v-empty-text").textContent = editable ? "Nothing has been written here yet." : "Nothing has been written here yet. An admin or editor can add the content.";
      $("v-empty-btn").hidden = !editable;
      $("v-empty-btn").href = pageHref("edit");
      $("v-empty-btn").innerHTML = KF.icon("pencil") + "Start writing";
    }

    /* ---------- Editor ---------- */
    let tags = [];
    let saved = "";   // snapshot of the last saved state, to spot unsaved changes

    function snapshot() {
      return JSON.stringify([$("e-title").value.trim(), $("e-content").value, $("e-status").value, tags]);
    }
    function isDirty() { return snapshot() !== saved || $("e-tag-field").value.trim() !== ""; }
    function updateDirty() { $("e-unsaved").hidden = !isDirty(); }

    function renderTags() {
      const box = $("e-tags");
      box.querySelectorAll(".tag").forEach(function (el) { el.remove(); });
      box.insertAdjacentHTML("afterbegin", tags.map(function (t, i) {
        return '<span class="tag tint-' + KF.tintFor(t) + '">' + esc(t) +
          '<button type="button" class="tag__remove" data-remove-tag="' + i + '" aria-label="Remove tag ' + esc(t) + '">' + KF.icon("x") + "</button></span>";
      }).join(""));
    }

    function addTag(raw) {
      String(raw).split(",").map(function (t) { return t.trim(); }).filter(Boolean).forEach(function (t) {
        if (!tags.some(function (x) { return x.toLowerCase() === t.toLowerCase(); })) tags.push(t);
      });
      renderTags();
    }

    function updatePreview() {
      const md = $("e-content").value;
      $("e-preview").innerHTML = md.trim() ? renderMarkdown(md) : '<p class="text-steel">The preview shows up here as you write.</p>';
    }

    function fillEditor() {
      $("e-title").value = doc.title || "";
      $("e-content").value = doc.content || "";
      $("e-status").value = String(doc.status).toUpperCase() === "PUBLISHED" ? "PUBLISHED" : "DRAFT";
      tags = Array.isArray(doc.tags) ? doc.tags.slice() : [];
      renderTags();
      updatePreview();
      saved = snapshot();
      updateDirty();
    }

    function titleError(msg) {
      $("e-title").setAttribute("aria-invalid", msg ? "true" : "false");
      $("e-title-error").hidden = !msg;
      $("e-title-error").innerHTML = msg ? KF.icon("alert-circle", "icon--sm") + esc(msg) : "";
    }

    async function save() {
      if ($("e-save").disabled) return;
      if ($("e-tag-field").value.trim()) { addTag($("e-tag-field").value); $("e-tag-field").value = ""; }
      const title = $("e-title").value.trim();
      titleError(title ? "" : "Give the document a title.");
      if (!title) { $("e-title").focus(); return; }
      await KF.withLoading($("e-save"), async function () {
        try {
          const body = { title: title, content: $("e-content").value, tags: tags, status: $("e-status").value };
          const updated = await KF.api(docUrl, { method: "PUT", json: body });
          doc = Object.assign(doc, updated || body);
          saved = snapshot();
          updateDirty();
          setCrumbs();
          KF.toast("Saved.");
        } catch (err) {
          KF.toast("Couldn't save. " + err.message, { type: "error" });
        }
      });
    }

    function bindEditor() {
      $("editor").addEventListener("submit", function (e) { e.preventDefault(); save(); });
      $("editor").addEventListener("input", updateDirty);
      $("editor").addEventListener("change", updateDirty);
      $("e-content").addEventListener("input", updatePreview);
      $("e-title").addEventListener("input", function () { if ($("e-title").value.trim()) titleError(""); });
      // Enter in the title jumps to the body instead of submitting
      $("e-title").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); $("e-content").focus({ preventScroll: true }); } });

      const field = $("e-tag-field");
      field.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === ",") {
          e.preventDefault();
          if (field.value.trim()) { addTag(field.value); field.value = ""; updateDirty(); }
        } else if (e.key === "Backspace" && !field.value && tags.length) {
          tags.pop(); renderTags(); updateDirty();
        }
      });
      field.addEventListener("blur", function () { if (field.value.trim()) { addTag(field.value); field.value = ""; updateDirty(); } });
      $("e-tags").addEventListener("click", function (e) {
        const btn = e.target.closest("[data-remove-tag]");
        if (btn) { tags.splice(Number(btn.dataset.removeTag), 1); renderTags(); updateDirty(); field.focus(); return; }
        if (e.target === $("e-tags")) field.focus();
      });

      document.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) { e.preventDefault(); save(); }
      });
      window.addEventListener("beforeunload", function (e) { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });

      // Write / Preview switch (phones and tablets)
      const panes = [$("pane-write"), $("pane-preview")];
      panes.forEach(function (tab, i) {
        tab.addEventListener("click", function () { showPane(i); });
        tab.addEventListener("keydown", function (e) {
          if (e.key === "ArrowRight" || e.key === "ArrowLeft") { showPane(1 - i); panes[1 - i].focus(); }
        });
      });
      function showPane(i) {
        $("e-split").dataset.pane = i ? "preview" : "write";
        panes.forEach(function (t, j) { t.setAttribute("aria-selected", String(i === j)); t.tabIndex = i === j ? 0 : -1; });
      }
      $("e-done").href = pageHref("view");
    }

    /* ---------- Load ---------- */
    function setCrumbs() {
      const title = (doc && doc.title) || "Untitled";
      document.title = title + " · KnowledgeForge";
      const team = space && KF.teams().find(function (t) { return t.teamId === space.teamId; });
      const crumbs = [];
      if (team) crumbs.push({ label: team.teamName || "Team", href: "/team.html?id=" + encodeURIComponent(team.teamId) });
      if (space) crumbs.push({ label: space.name || "Space", href: "/space.html?id=" + encodeURIComponent(doc.spaceId) });
      crumbs.push({ label: title });
      KF.setBreadcrumbs(crumbs);
    }

    function showLoadError(err) {
      $("loading").hidden = true;
      $("view").hidden = true;
      $("editor").hidden = true;
      const known = err.status === 403 || err.status === 404 || !docId;
      $("load-error-msg").textContent = !docId ? "No document was picked. Open one from its space."
        : err.status === 403 ? "You're not a member of this document's team. Ask a team admin for an invite link."
        : err.status === 404 ? "This document doesn't exist. It may have been deleted."
        : "Couldn't load this document. " + err.message;
      $("retry-btn").hidden = known;
      $("back-btn").hidden = !known;
      $("load-error").hidden = false;
    }

    async function load() {
      $("load-error").hidden = true;
      try {
        doc = (await KF.api(docUrl)) || {};
        // Space + team only add names and permissions; the document still shows if they fail
        space = await KF.api("/api/spaces/" + encodeURIComponent(doc.spaceId)).catch(function () { return null; });
        if (space) {
          const team = await KF.api("/api/teams/" + encodeURIComponent(space.teamId)).catch(function () { return null; });
          members = {};
          ((team && team.teamMembers) || []).forEach(function (m) { members[m.userId] = m; });
          const link = document.querySelector('#kf-sidebar a[href="/team.html?id=' + encodeURIComponent(space.teamId) + '"]');
          if (link) { link.classList.add("is-active"); link.setAttribute("aria-current", "page"); }
        }
        editable = !!space && KF.canEdit(space.teamId);
        setCrumbs();
        $("loading").hidden = true;

        if (wantsEdit && editable) {
          document.getElementById("main").classList.remove("page--reading");
          bindEditor();
          fillEditor();
          $("editor").hidden = false;
          $("e-content").focus({ preventScroll: true });
        } else {
          if (wantsEdit) history.replaceState(null, "", pageHref("view")); // viewers never get the editor
          renderView();
          $("view").hidden = false;
          if (editable) {
            $("kf-actions").innerHTML = '<a class="btn btn--primary btn--sm" href="' + esc(pageHref("edit")) + '">' + KF.icon("pencil") + "Edit</a>";
          }
        }
      } catch (err) {
        showLoadError(err);
      }
    }

    let shellReady = false;
    $("retry-btn").addEventListener("click", function () {
      if (!shellReady) { location.reload(); return; }
      KF.withLoading($("retry-btn"), load);
    });

    KF.initShell({ active: null, breadcrumbs: [{ label: "Document" }] }).then(function () {
      shellReady = true;
      if (!docId) { showLoadError({}); return; }
      return load();
    }, showLoadError);
  })();
</script>
</body>
</html>

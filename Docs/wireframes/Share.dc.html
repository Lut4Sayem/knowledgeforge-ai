<div aria-hidden="true" style="width: 100%; max-width: 720px; height: 16px; border-radius: 4px; background: #edecea;"></div>
</main>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(15,15,15,0.32);"></div>
<div role="dialog" aria-label="Share Budget" style="position: absolute; top: 72px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 32px)); box-sizing: border-box; background: #ffffff; border-radius: 12px; box-shadow: 0 16px 48px -8px rgba(15,15,15,0.16); padding: 24px; display: flex; flex-direction: column; gap: 20px;">
<div style="display: flex; align-items: center; justify-content: space-between;"><h2 style="margin: 0; font-size: 20px; font-weight: 600;">Share "Budget"</h2><button aria-label="Close" style="width: 32px; height: 32px; border: 0; background: transparent; font-size: 20px; color: #5d5b54; cursor: pointer;">×</button></div>
<section style="display: flex; flex-direction: column; gap: 10px;">
<h3 style="margin: 0; font-size: 14px; font-weight: 600;">Who can open this page</h3>
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px;"><input type="radio" name="access" style="margin-top: 3px;"><span style="display: flex; flex-direction: column; gap: 2px;"><span>Same as "Thesis"</span><span style="font-size: 13px; color: #5d5b54;">All 4 team members, with their team role</span></span></label>
<label style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px;"><input type="radio" name="access" checked style="margin-top: 3px;"><span style="display: flex; flex-direction: column; gap: 2px;"><span>Only these people</span><span style="font-size: 13px; color: #5d5b54;">Sub-pages follow this too</span></span></label>
<div style="margin-left: 24px; border: 1px solid #e5e3df; border-radius: 8px; display: flex; flex-direction: column;">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px;"><span style="width: 28px; height: 28px; border-radius: 9999px; background: #d9e4f1; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;">LS</span><span style="flex-grow: 1; font-size: 14px;">You</span><select aria-label="Access for you" style="height: 32px; border: 1px solid #c8c4be; border-radius: 6px; font: inherit; font-size: 13px;"><option>Can edit</option><option>Can view</option></select></div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid #ede9e4;"><span style="width: 28px; height: 28px; border-radius: 9999px; background: #d9f3e1; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;">R</span><span style="flex-grow: 1; font-size: 14px;">Rafi</span><select aria-label="Access for Rafi" style="height: 32px; border: 1px solid #c8c4be; border-radius: 6px; font: inherit; font-size: 13px;"><option>Can edit</option><option>Can view</option><option>Remove</option></select></div>
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid #ede9e4;"><span style="width: 28px; height: 28px; border-radius: 9999px; background: #ffe8d4; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;">T</span><span style="flex-grow: 1; font-size: 14px;">Tanvir <span style="font-size: 12px; color: #5d5b54;">(team viewer: view only)</span></span><select aria-label="Access for Tanvir" style="height: 32px; border: 1px solid #c8c4be; border-radius: 6px; font: inherit; font-size: 13px;"><option>Can view</option><option>Remove</option></select></div>
<label style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid #ede9e4; font-size: 14px;"><span style="color: #5d5b54;">Add</span><input placeholder="Name of someone who can see Thesis" style="flex-grow: 1; height: 32px; border: 1px solid #c8c4be; border-radius: 6px; padding: 0 8px; font: inherit; font-size: 13px;"></label>
</div>
</section>
<section style="display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #e5e3df; padding-top: 16px;">
<h3 style="margin: 0; font-size: 14px; font-weight: 600;">Public link</h3>
<label style="display: flex; align-items: center; gap: 10px; font-size: 14px;"><input type="checkbox" checked>Anyone with the link can view (no account needed)</label>
<div style="display: flex; gap: 8px; flex-wrap: wrap;"><label style="flex: 1 1 260px; display: flex;"><span style="position: absolute; left: -9999px;">Public link</span><input readonly value="knowledgeforge.app/s/7f3k…q9" style="flex-grow: 1; height: 36px; border: 1px solid #c8c4be; border-radius: 8px; padding: 0 10px; font: inherit; font-size: 13px; color: #37352f; background: #fafaf9;"></label><button style="height: 36px; padding: 0 14px; border: 0; background: #1f6fc5; color: #ffffff; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;">Copy link</button></div>
<div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px;"><label style="display: flex; align-items: center; gap: 8px;">Expires<select style="height: 32px; border: 1px solid #c8c4be; border-radius: 6px; font: inherit; font-size: 13px;"><option>Never</option><option>In 7 days</option><option>In 30 days</option></select></label><button style="height: 32px; padding: 0 10px; border: 0; background: transparent; font: inherit; font-size: 13px; color: #c42b2b; cursor: pointer;">Turn off link</button></div>
<p style="margin: 0; font-size: 13px; color: #5d5b54;">Only published pages can have a public link. Restricted sub-pages stay hidden from the link.</p>
</section>
</div>
</div>

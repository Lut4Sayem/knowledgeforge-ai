name: Deploy image

# Builds the image and pushes it to GHCR. The VM pulls it on a timer (deploy/update.sh).
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lut4sayem/knowledgeforge-ai:latest
            ghcr.io/lut4sayem/knowledgeforge-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
